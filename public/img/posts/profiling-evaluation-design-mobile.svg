<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1580" viewBox="0 0 720 1580" role="img" aria-labelledby="title desc">
  <title id="title">固定属性評価とタグ属性評価におけるLLMの使い方の違い</title>
  <desc id="desc">固定属性評価では生履歴側だけがLLMを使い属性データベース側は規則集約する。タグ属性評価では生履歴と属性データベースの両方を同じLLM評価役に入力してAUCを比較する。</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#597068"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17362b" flood-opacity=".11"/></filter></defs>
  <style>text{font-size:26px!important}.title{font-size:36px!important}.note{font-size:21px!important}</style>
  <rect width="720" height="1580" rx="28" fill="#f7faf8"/>
  <text class="title" x="44" y="58" fill="#17362b" font-family="system-ui, sans-serif" font-size="29" font-weight="750">評価ごとにLLMの置き方が違う</text>

  <g filter="url(#shadow)"><rect x="55" y="100" width="610" height="650" rx="24" fill="#ffffff" stroke="#77a591" stroke-width="2"/><text x="90" y="146" fill="#1d6046" font-family="system-ui, sans-serif" font-size="27" font-weight="780">固定属性：非対称</text><text x="90" y="180" fill="#597068" font-family="system-ui, sans-serif" font-size="18">年齢・性別・収入・教育・転居</text>
    <rect x="90" y="220" width="230" height="60" rx="16" fill="#eef3f1"/><text x="205" y="258" text-anchor="middle" fill="#17362b" font-family="system-ui, sans-serif" font-size="20">生の購入履歴</text><path d="M320 250H370" fill="none" stroke="#597068" stroke-width="4" marker-end="url(#arrow)"/><rect x="395" y="220" width="230" height="60" rx="16" fill="#eaf0f8"/><text x="510" y="246" text-anchor="middle" fill="#2a5680" font-family="system-ui, sans-serif" font-size="19" font-weight="750">LLM予測</text><text x="510" y="270" text-anchor="middle" fill="#597068" font-family="system-ui, sans-serif" font-size="15">直接ラベルを出す</text>
    <rect x="90" y="315" width="230" height="60" rx="16" fill="#f0eafa"/><text x="205" y="353" text-anchor="middle" fill="#633f8d" font-family="system-ui, sans-serif" font-size="20">属性DB</text><path d="M320 345H370" fill="none" stroke="#597068" stroke-width="4" marker-end="url(#arrow)"/><rect x="395" y="315" width="230" height="60" rx="16" fill="#fff1df"/><text x="510" y="352" text-anchor="middle" fill="#91511c" font-family="system-ui, sans-serif" font-size="18" font-weight="750">OR／中央値／最頻値</text>
    <path d="M510 375V430" fill="none" stroke="#597068" stroke-width="4" marker-end="url(#arrow)"/><rect x="145" y="455" width="430" height="105" rx="20" fill="#e8f4ee"/><text x="360" y="496" text-anchor="middle" fill="#1d6046" font-family="system-ui, sans-serif" font-size="21" font-weight="750">DB側は評価時の追加LLMなし</text><text x="360" y="530" text-anchor="middle" fill="#17362b" font-family="system-ui, sans-serif" font-size="18">それぞれ属性予測を作る</text><path d="M360 560V606" fill="none" stroke="#597068" stroke-width="4" marker-end="url(#arrow)"/><rect x="185" y="630" width="350" height="78" rx="18" fill="#2f7d5c"/><text x="360" y="663" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="750">自己申告と比較</text><text x="360" y="689" text-anchor="middle" fill="#e6f4ed" font-family="system-ui, sans-serif" font-size="17">F1／MAE</text></g>

  <g filter="url(#shadow)"><rect x="55" y="790" width="610" height="690" rx="24" fill="#ffffff" stroke="#7596bc" stroke-width="2"/><text x="90" y="836" fill="#2a5680" font-family="system-ui, sans-serif" font-size="27" font-weight="780">タグ属性：対称</text><text x="90" y="870" fill="#597068" font-family="system-ui, sans-serif" font-size="18">喫煙・飲酒・糖尿病・出産など10属性</text>
    <rect x="90" y="910" width="230" height="60" rx="16" fill="#eef3f1"/><text x="205" y="948" text-anchor="middle" fill="#17362b" font-family="system-ui, sans-serif" font-size="20">生の購入履歴</text><rect x="90" y="990" width="230" height="60" rx="16" fill="#f0eafa"/><text x="205" y="1028" text-anchor="middle" fill="#633f8d" font-family="system-ui, sans-serif" font-size="19">タグ＋固定属性</text><path d="M320 940H370" fill="none" stroke="#597068" stroke-width="4" marker-end="url(#arrow)"/><path d="M320 1020H370" fill="none" stroke="#597068" stroke-width="4" marker-end="url(#arrow)"/><rect x="395" y="900" width="230" height="160" rx="20" fill="#eaf0f8" stroke="#7596bc" stroke-width="2"/><text x="510" y="943" text-anchor="middle" fill="#2a5680" font-family="system-ui, sans-serif" font-size="20" font-weight="750">同じLLM評価役</text><text x="510" y="977" text-anchor="middle" fill="#17362b" font-family="system-ui, sans-serif" font-size="17">同じプロンプト形式</text><text x="510" y="1010" text-anchor="middle" fill="#597068" font-family="system-ui, sans-serif" font-size="16">属性確率を出す</text>
    <path d="M510 1060V1110" fill="none" stroke="#597068" stroke-width="4" marker-end="url(#arrow)"/><rect x="145" y="1135" width="430" height="100" rx="20" fill="#fff1df"/><text x="360" y="1175" text-anchor="middle" fill="#91511c" font-family="system-ui, sans-serif" font-size="21" font-weight="750">確率スコア</text><text x="360" y="1208" text-anchor="middle" fill="#17362b" font-family="system-ui, sans-serif" font-size="18">入力表現だけが違う</text><path d="M360 1235V1282" fill="none" stroke="#597068" stroke-width="4" marker-end="url(#arrow)"/><rect x="185" y="1305" width="350" height="90" rx="18" fill="#2f7d5c"/><text x="360" y="1342" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="750">AUCで順位を比較</text><text x="360" y="1372" text-anchor="middle" fill="#e6f4ed" font-family="system-ui, sans-serif" font-size="17">両入力に同じ評価役</text></g>
  <text class="note" x="44" y="1530" fill="#597068" font-family="system-ui, sans-serif" font-size="17">生履歴は、圧縮前の情報を持つ参照入力。</text>
</svg>
