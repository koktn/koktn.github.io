<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">全体分析と二つのtrigger分析の対象範囲</title>
  <desc id="desc">同じユーザーの5セッションに対し、全体分析はすべて、User-trigger分析は最初のtrigger以降、Session-trigger分析はtriggerを含むセッションだけを残す。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .heading { font-size: 23px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 13px; fill: #475569; }
      .session { stroke: #64748b; stroke-width: 2; rx: 12; }
      .keep { stroke: #2563eb; stroke-width: 3; fill: none; rx: 15; }
      .exclude { opacity: .28; }
      .axis { stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="520" rx="20" fill="#f8fafc"/>
  <text x="38" y="46" class="heading">同じ5セッションをどこまで残すか</text>
  <line x1="315" y1="84" x2="1045" y2="84" class="axis"/>
  <text x="1050" y="90" class="small">時間</text>

  <text x="40" y="145" class="label">全体分析</text>
  <text x="40" y="168" class="small">すべてを比較</text>
  <g>
    <rect x="300" y="112" width="130" height="72" class="session" fill="#ffffff"/>
    <rect x="445" y="112" width="130" height="72" class="session" fill="#dbeafe"/>
    <rect x="590" y="112" width="130" height="72" class="session" fill="#ffffff"/>
    <rect x="735" y="112" width="130" height="72" class="session" fill="#dbeafe"/>
    <rect x="880" y="112" width="130" height="72" class="session" fill="#ffffff"/>
    <text x="365" y="143" text-anchor="middle" class="label">S1・U</text>
    <text x="510" y="143" text-anchor="middle" class="label">S2・T</text>
    <text x="655" y="143" text-anchor="middle" class="label">S3・U</text>
    <text x="800" y="143" text-anchor="middle" class="label">S4・T</text>
    <text x="945" y="143" text-anchor="middle" class="label">S5・U</text>
    <text x="365" y="168" text-anchor="middle" class="small">triggerなし</text>
    <text x="510" y="168" text-anchor="middle" class="small">triggerあり</text>
    <text x="655" y="168" text-anchor="middle" class="small">triggerなし</text>
    <text x="800" y="168" text-anchor="middle" class="small">triggerあり</text>
    <text x="945" y="168" text-anchor="middle" class="small">triggerなし</text>
  </g>

  <text x="40" y="282" class="label">User-trigger</text>
  <text x="40" y="305" class="small">最初のtrigger以降</text>
  <g>
    <rect x="300" y="249" width="130" height="72" class="session exclude" fill="#ffffff"/>
    <rect x="445" y="249" width="130" height="72" class="session" fill="#dbeafe"/>
    <rect x="590" y="249" width="130" height="72" class="session" fill="#ffffff"/>
    <rect x="735" y="249" width="130" height="72" class="session" fill="#dbeafe"/>
    <rect x="880" y="249" width="130" height="72" class="session" fill="#ffffff"/>
    <rect x="438" y="240" width="579" height="90" class="keep"/>
    <text x="365" y="291" text-anchor="middle" class="label exclude">S1・U</text>
    <text x="510" y="291" text-anchor="middle" class="label">S2・T</text>
    <text x="655" y="291" text-anchor="middle" class="label">S3・U</text>
    <text x="800" y="291" text-anchor="middle" class="label">S4・T</text>
    <text x="945" y="291" text-anchor="middle" class="label">S5・U</text>
  </g>

  <text x="40" y="418" class="label">Session-trigger</text>
  <text x="40" y="441" class="small">triggerを含むsessionだけ</text>
  <g>
    <rect x="300" y="385" width="130" height="72" class="session exclude" fill="#ffffff"/>
    <rect x="445" y="385" width="130" height="72" class="session" fill="#dbeafe"/>
    <rect x="590" y="385" width="130" height="72" class="session exclude" fill="#ffffff"/>
    <rect x="735" y="385" width="130" height="72" class="session" fill="#dbeafe"/>
    <rect x="880" y="385" width="130" height="72" class="session exclude" fill="#ffffff"/>
    <rect x="438" y="376" width="144" height="90" class="keep"/>
    <rect x="728" y="376" width="144" height="90" class="keep"/>
    <text x="365" y="427" text-anchor="middle" class="label exclude">S1・U</text>
    <text x="510" y="427" text-anchor="middle" class="label">S2・T</text>
    <text x="655" y="427" text-anchor="middle" class="label exclude">S3・U</text>
    <text x="800" y="427" text-anchor="middle" class="label">S4・T</text>
    <text x="945" y="427" text-anchor="middle" class="label exclude">S5・U</text>
  </g>
  <text x="300" y="494" class="small">青枠＝分析へ残す範囲　U＝triggerなし　T＝triggerあり（説明用の仮想例）</text>
</svg>
