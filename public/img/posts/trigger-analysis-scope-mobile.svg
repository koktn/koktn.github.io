<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 940" role="img" aria-labelledby="title desc">
  <title id="title">全体分析と二つのtrigger分析の対象範囲</title>
  <desc id="desc">同じユーザーの5セッションに対し、全体分析はすべて、User-trigger分析は最初のtrigger以降、Session-trigger分析はtriggerを含むセッションだけを残す。</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .heading { font-size: 19px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 700; }
      .small { font-size: 12px; fill: #475569; }
      .session { stroke: #64748b; stroke-width: 2; rx: 9; }
      .keep { stroke: #2563eb; stroke-width: 3; fill: none; rx: 11; }
      .exclude { opacity: .28; }
    </style>
  </defs>
  <rect width="390" height="940" rx="18" fill="#f8fafc"/>
  <text x="20" y="34" class="heading">どのsessionを残すか</text>

  <text x="20" y="80" class="label">全体分析</text>
  <text x="20" y="100" class="small">すべてを比較</text>
  <g>
    <rect x="20" y="120" width="62" height="66" class="session" fill="#ffffff"/>
    <rect x="92" y="120" width="62" height="66" class="session" fill="#dbeafe"/>
    <rect x="164" y="120" width="62" height="66" class="session" fill="#ffffff"/>
    <rect x="236" y="120" width="62" height="66" class="session" fill="#dbeafe"/>
    <rect x="308" y="120" width="62" height="66" class="session" fill="#ffffff"/>
    <text x="51" y="150" text-anchor="middle" class="label">S1</text><text x="51" y="173" text-anchor="middle" class="small">U</text>
    <text x="123" y="150" text-anchor="middle" class="label">S2</text><text x="123" y="173" text-anchor="middle" class="small">T</text>
    <text x="195" y="150" text-anchor="middle" class="label">S3</text><text x="195" y="173" text-anchor="middle" class="small">U</text>
    <text x="267" y="150" text-anchor="middle" class="label">S4</text><text x="267" y="173" text-anchor="middle" class="small">T</text>
    <text x="339" y="150" text-anchor="middle" class="label">S5</text><text x="339" y="173" text-anchor="middle" class="small">U</text>
  </g>

  <text x="20" y="245" class="label">User-trigger</text>
  <text x="20" y="265" class="small">最初のtrigger以降を残す</text>
  <g>
    <rect x="20" y="290" width="62" height="66" class="session exclude" fill="#ffffff"/>
    <rect x="92" y="290" width="62" height="66" class="session" fill="#dbeafe"/>
    <rect x="164" y="290" width="62" height="66" class="session" fill="#ffffff"/>
    <rect x="236" y="290" width="62" height="66" class="session" fill="#dbeafe"/>
    <rect x="308" y="290" width="62" height="66" class="session" fill="#ffffff"/>
    <rect x="86" y="282" width="290" height="82" class="keep"/>
    <text x="51" y="330" text-anchor="middle" class="label exclude">S1</text>
    <text x="123" y="330" text-anchor="middle" class="label">S2</text>
    <text x="195" y="330" text-anchor="middle" class="label">S3</text>
    <text x="267" y="330" text-anchor="middle" class="label">S4</text>
    <text x="339" y="330" text-anchor="middle" class="label">S5</text>
  </g>

  <text x="20" y="425" class="label">Session-trigger</text>
  <text x="20" y="445" class="small">triggerを含むsessionだけ残す</text>
  <g>
    <rect x="20" y="470" width="62" height="66" class="session exclude" fill="#ffffff"/>
    <rect x="92" y="470" width="62" height="66" class="session" fill="#dbeafe"/>
    <rect x="164" y="470" width="62" height="66" class="session exclude" fill="#ffffff"/>
    <rect x="236" y="470" width="62" height="66" class="session" fill="#dbeafe"/>
    <rect x="308" y="470" width="62" height="66" class="session exclude" fill="#ffffff"/>
    <rect x="86" y="462" width="74" height="82" class="keep"/>
    <rect x="230" y="462" width="74" height="82" class="keep"/>
    <text x="51" y="510" text-anchor="middle" class="label exclude">S1</text>
    <text x="123" y="510" text-anchor="middle" class="label">S2</text>
    <text x="195" y="510" text-anchor="middle" class="label exclude">S3</text>
    <text x="267" y="510" text-anchor="middle" class="label">S4</text>
    <text x="339" y="510" text-anchor="middle" class="label exclude">S5</text>
  </g>

  <rect x="20" y="600" width="350" height="285" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="40" y="635" class="label">読み方</text>
  <rect x="40" y="660" width="56" height="50" class="session" fill="#dbeafe"/>
  <text x="68" y="691" text-anchor="middle" class="label">T</text>
  <text x="115" y="680" class="small">triggerを含むsession</text>
  <text x="115" y="700" class="small">（青い背景）</text>
  <rect x="40" y="735" width="56" height="50" class="session" fill="#ffffff"/>
  <text x="68" y="766" text-anchor="middle" class="label">U</text>
  <text x="115" y="755" class="small">triggerを含まないsession</text>
  <text x="115" y="775" class="small">（白い背景）</text>
  <rect x="36" y="805" width="64" height="58" class="keep"/>
  <text x="115" y="832" class="small">青枠は分析へ残す範囲</text>
  <text x="115" y="852" class="small">説明用の仮想例</text>
</svg>
