<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 800" role="img" aria-labelledby="title desc">
  <title id="title">申込者単位と特徴量単位の説明を区別する</title>
  <desc id="desc">申込者の21特徴量から得る完済確率と短い説明、置換入力によるSHAP寄与、特徴量の説明だけを使う方向判定を区別した図。</desc>
  <style>text{font-family:system-ui,sans-serif;fill:#172536}.head{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.line{stroke:#34465b;stroke-width:2;fill:none}</style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#34465b"/></marker></defs>
  <rect width="360" height="800" rx="12" fill="#f4f7fb"/>
  <text x="20" y="34" class="head">二種類の説明を分けて読む</text>
  <text x="20" y="72" class="head">1. 申込者単位</text>
  <rect x="20" y="88" width="320" height="62" rx="8" fill="#e1eaf4"/>
  <text x="36" y="115" class="head">申込者の貸付情報</text><text x="36" y="139" class="body">21特徴量</text>
  <path d="M100 150V174M260 150V174" class="line" marker-end="url(#arrow)"/>
  <rect x="20" y="184" width="150" height="116" rx="8" fill="#fff" stroke="#526b84"/>
  <text x="32" y="213" class="head">通常の入力</text><text x="32" y="243" class="body">完済確率</text><text x="32" y="269" class="body">＋短い説明</text>
  <rect x="190" y="184" width="150" height="116" rx="8" fill="#fff" stroke="#526b84"/>
  <text x="202" y="213" class="head">置換した入力</text><text x="202" y="243" class="body">予測関数を</text><text x="202" y="269" class="body">繰り返し評価</text>
  <path d="M100 300V324M260 300V324" class="line" marker-end="url(#arrow)"/>
  <rect x="20" y="334" width="150" height="86" rx="8" fill="#e1eaf4"/>
  <text x="32" y="363" class="head">予測理由</text><text x="32" y="393" class="body">短い説明文</text>
  <rect x="190" y="334" width="150" height="86" rx="8" fill="#e1eaf4"/>
  <text x="202" y="363" class="head">SHAP寄与</text><text x="202" y="393" class="body">申込者ごとの値</text>
  <path d="M100 420V444H180M260 420V444H180" class="line"/>
  <path d="M180 444V468" class="line" marker-end="url(#arrow)"/>
  <rect x="20" y="478" width="320" height="64" rx="8" fill="#fff" stroke="#526b84"/>
  <text x="36" y="506" class="head">申込者単位で照合</text><text x="36" y="530" class="small">論文の結果には定量評価の掲載なし</text>
  <text x="20" y="580" class="head">2. 特徴量単位</text>
  <rect x="20" y="596" width="150" height="92" rx="8" fill="#fff" stroke="#526b84"/>
  <text x="32" y="625" class="head">別プロンプト</text><text x="32" y="653" class="body">特徴量の説明</text><text x="32" y="677" class="small">申込者データなし</text>
  <rect x="190" y="596" width="150" height="92" rx="8" fill="#fff" stroke="#526b84"/>
  <text x="202" y="625" class="head">SHAP依存</text><text x="202" y="653" class="body">複数の値域で</text><text x="202" y="677" class="small">寄与の方向を観測</text>
  <path d="M100 688V712M260 688V712" class="line" marker-end="url(#arrow)"/>
  <rect x="20" y="722" width="320" height="58" rx="8" fill="#e1eaf4"/>
  <text x="36" y="750" class="head">方向判定と依存を照合</text><text x="36" y="772" class="small">DTIの不一致はこの比較</text>
</svg>
