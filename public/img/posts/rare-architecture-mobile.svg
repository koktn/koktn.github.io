<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1120" role="img" aria-labelledby="title desc">
  <title id="title">RAREの広告indexingとquery retrieval</title>
  <desc id="desc">広告側でCI集合と転置インデックスを構築し、query側ではcacheまたは1Bモデルが生成したCIから広告を検索する縦長の図</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .title { font-size: 28px; font-weight: 700; }
      .section { font-size: 22px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 650; }
      .small { font-size: 16px; fill: #475569; }
      .box { fill: #fff; stroke: #94a3b8; stroke-width: 2; rx: 15; }
      .offline { fill: #eff6ff; stroke: #2563eb; }
      .online { fill: #ecfdf5; stroke: #059669; }
      .index { fill: #fff7ed; stroke: #ea580c; }
      .line { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="720" height="1120" fill="#f8fafc" rx="24"/>
  <text x="360" y="48" text-anchor="middle" class="title">LLMと転置indexの分担</text>
  <rect x="30" y="78" width="660" height="486" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" rx="20"/>
  <text x="55" y="116" class="section">オフライン：広告側</text>
  <rect x="205" y="142" width="310" height="72" class="box"/><text x="360" y="174" text-anchor="middle" class="label">広告素材</text><text x="360" y="198" text-anchor="middle" class="small">title・landing page</text>
  <rect x="205" y="248" width="310" height="82" class="box offline"/><text x="360" y="281" text-anchor="middle" class="label">13B LLM</text><text x="360" y="308" text-anchor="middle" class="small">知識注入＋形式調整</text>
  <rect x="205" y="364" width="310" height="82" class="box offline"/><text x="360" y="397" text-anchor="middle" class="label">約200万種類のCI</text><text x="360" y="424" text-anchor="middle" class="small">clustering＋専門家評価</text>
  <rect x="205" y="480" width="310" height="62" class="box index"/><text x="360" y="518" text-anchor="middle" class="label">CI → 広告index</text>
  <path d="M360 214 V238" class="line"/><path d="M360 330 V354" class="line"/><path d="M360 446 V470" class="line"/>

  <rect x="30" y="594" width="660" height="478" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" rx="20"/>
  <text x="55" y="632" class="section">オンライン：query側</text>
  <rect x="235" y="656" width="250" height="62" class="box"/><text x="360" y="694" text-anchor="middle" class="label">query</text>
  <rect x="70" y="760" width="250" height="78" class="box online"/><text x="195" y="792" text-anchor="middle" class="label">cache hit</text><text x="195" y="818" text-anchor="middle" class="small">事前生成CI</text>
  <rect x="400" y="760" width="250" height="78" class="box online"/><text x="525" y="792" text-anchor="middle" class="label">cache miss</text><text x="525" y="818" text-anchor="middle" class="small">1B LLM</text>
  <rect x="205" y="880" width="310" height="78" class="box online"/><text x="360" y="912" text-anchor="middle" class="label">制約付きCI生成</text><text x="360" y="938" text-anchor="middle" class="small">既存CIだけ・平均3 token</text>
  <rect x="70" y="988" width="250" height="60" class="box index"/><text x="195" y="1025" text-anchor="middle" class="label">転置index</text>
  <rect x="400" y="988" width="250" height="60" class="box"/><text x="525" y="1025" text-anchor="middle" class="label">広告候補</text>
  <path d="M360 718 C360 738 195 734 195 750" class="line"/><path d="M360 718 C360 738 525 734 525 750" class="line"/>
  <path d="M195 838 C195 862 330 852 340 870" class="line"/><path d="M525 838 C525 862 390 852 380 870" class="line"/>
  <path d="M360 958 C360 978 215 972 205 978" class="line"/><path d="M320 1018 H390" class="line"/>
  <text x="360" y="1100" text-anchor="middle" class="small">矢印はdata flow。rankerは広告候補の後段。</text>
</svg>
