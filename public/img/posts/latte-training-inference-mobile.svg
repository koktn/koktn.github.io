<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1030" role="img" aria-labelledby="title desc">
  <title id="title">LATTEの学習と二つの推論方式</title>
  <desc id="desc">取引履歴を統計要約と生系列へ分け、文章と系列のembeddingを対照学習でそろえる。推論では完全版LATTEが両方を使い、LATTE-Sは系列encoderだけを使う。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .label { font-size: 17px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; fill: #475569; }
      .box { stroke: #64748b; stroke-width: 2; rx: 12; }
      .line { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; }
    </style>
  </defs>
  <rect width="390" height="1030" fill="#f8fafc" rx="18"/>
  <text x="20" y="34" class="label">学習時</text>
  <rect x="90" y="52" width="210" height="68" class="box" fill="#e2e8f0"/>
  <text x="195" y="80" text-anchor="middle" class="label">取引履歴</text>
  <text x="195" y="104" text-anchor="middle" class="body">時刻・金額・MCC</text>
  <path d="M195 120 V145" class="line"/>

  <rect x="25" y="152" width="155" height="86" class="box" fill="#dcfce7"/>
  <text x="102" y="181" text-anchor="middle" class="label">統計要約</text>
  <text x="102" y="205" text-anchor="middle" class="body">頻度・期間・収支</text>
  <text x="102" y="225" text-anchor="middle" class="small">主要category</text>
  <rect x="210" y="152" width="155" height="86" class="box" fill="#dbeafe"/>
  <text x="287" y="181" text-anchor="middle" class="label">生の系列</text>
  <text x="287" y="205" text-anchor="middle" class="body">順序と属性</text>

  <path d="M102 238 V266" class="line"/>
  <path d="M287 238 V364" class="line"/>
  <rect x="25" y="272" width="155" height="78" class="box" fill="#fef3c7"/>
  <text x="102" y="301" text-anchor="middle" class="label">固定LLM</text>
  <text x="102" y="326" text-anchor="middle" class="body">行動説明文</text>
  <path d="M102 350 V378" class="line"/>

  <rect x="25" y="384" width="155" height="78" class="box" fill="#ffedd5"/>
  <text x="102" y="413" text-anchor="middle" class="label">text encoder</text>
  <text x="102" y="438" text-anchor="middle" class="body">z_text</text>
  <rect x="210" y="370" width="155" height="92" class="box" fill="#dbeafe"/>
  <text x="287" y="403" text-anchor="middle" class="label">GRU encoder</text>
  <text x="287" y="431" text-anchor="middle" class="body">z_seq</text>

  <path d="M102 462 V495 H145" class="line"/>
  <path d="M287 462 V495 H245" class="line"/>
  <rect x="110" y="502" width="170" height="88" class="box" fill="#ede9fe"/>
  <text x="195" y="535" text-anchor="middle" class="label">対照学習</text>
  <text x="195" y="560" text-anchor="middle" class="body">同じ顧客を近づける</text>
  <text x="195" y="579" text-anchor="middle" class="small">系列側を更新</text>

  <line x1="20" y1="632" x2="370" y2="632" class="dash"/>
  <text x="20" y="670" class="label">推論時</text>
  <rect x="25" y="695" width="155" height="116" class="box" fill="#ede9fe"/>
  <text x="102" y="728" text-anchor="middle" class="label">LATTE</text>
  <text x="102" y="754" text-anchor="middle" class="body">系列 + 文章</text>
  <text x="102" y="775" text-anchor="middle" class="body">+ 統計</text>
  <text x="102" y="798" text-anchor="middle" class="small">生成経路が必要</text>
  <rect x="210" y="695" width="155" height="116" class="box" fill="#dbeafe"/>
  <text x="287" y="728" text-anchor="middle" class="label">LATTE-S</text>
  <text x="287" y="754" text-anchor="middle" class="body">系列encoderのみ</text>
  <text x="287" y="780" text-anchor="middle" class="small">数百万parameter</text>

  <path d="M102 811 V855 H160" class="line"/>
  <path d="M287 811 V855 H230" class="line"/>
  <rect x="55" y="862" width="280" height="118" class="box" fill="#dcfce7"/>
  <text x="195" y="899" text-anchor="middle" class="label">下流task</text>
  <text x="195" y="928" text-anchor="middle" class="body">Churn・Age Group・Gender</text>
  <text x="195" y="955" text-anchor="middle" class="small">embeddingをLightGBMで評価</text>
</svg>
