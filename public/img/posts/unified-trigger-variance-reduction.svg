<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc">
  <title id="title">Trigger情報を使う統一的な分散削減</title>
  <desc id="desc">各ユーザーの全体指標、trigger complement指標、trigger率、100% triggerの指示変数を集計し、共変量調整してtreatment群とcontrol群の全体効果を直接推定する。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .heading { font-size: 23px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 13px; fill: #475569; }
      .box { stroke: #64748b; stroke-width: 2; rx: 14; }
      .line { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="610" rx="20" fill="#f8fafc"/>
  <text x="38" y="45" class="heading">Model (6)：全体効果を直接推定する</text>

  <rect x="40" y="95" width="190" height="118" class="box" fill="#e2e8f0"/>
  <text x="135" y="132" text-anchor="middle" class="label">ユーザー別ログ</text>
  <text x="135" y="160" text-anchor="middle" class="body">セッション・成功</text>
  <text x="135" y="184" text-anchor="middle" class="body">trigger判定・群</text>
  <path d="M230 154 H285" class="line"/>

  <rect x="290" y="75" width="230" height="300" class="box" fill="#ffffff"/>
  <text x="405" y="112" text-anchor="middle" class="label">ユーザー単位に集計</text>
  <rect x="320" y="138" width="170" height="48" rx="9" fill="#dbeafe" stroke="#64748b"/>
  <text x="405" y="168" text-anchor="middle" class="body">全体指標 X</text>
  <rect x="320" y="202" width="170" height="48" rx="9" fill="#dcfce7" stroke="#64748b"/>
  <text x="405" y="232" text-anchor="middle" class="body">complement指標 UnTrX</text>
  <rect x="320" y="266" width="170" height="48" rx="9" fill="#fef3c7" stroke="#64748b"/>
  <text x="405" y="296" text-anchor="middle" class="body">trigger率 TR</text>
  <rect x="320" y="330" width="170" height="48" rx="9" fill="#ede9fe" stroke="#64748b"/>
  <text x="405" y="360" text-anchor="middle" class="body">I(TR = 1)</text>

  <path d="M520 228 H585" class="line"/>
  <rect x="590" y="110" width="255" height="240" class="box" fill="#eef2ff"/>
  <text x="718" y="150" text-anchor="middle" class="label">共変量で調整</text>
  <text x="718" y="185" text-anchor="middle" class="body">X_adj = X</text>
  <text x="718" y="215" text-anchor="middle" class="body">− θ₁ UnTrX</text>
  <text x="718" y="245" text-anchor="middle" class="body">− θ₂ TR</text>
  <text x="718" y="275" text-anchor="middle" class="body">− θ₃ I(TR = 1)</text>
  <text x="718" y="318" text-anchor="middle" class="small">期待値を保ち、偶然の揺れを削る</text>

  <path d="M845 228 H905" class="line"/>
  <rect x="910" y="135" width="170" height="185" class="box" fill="#dcfce7"/>
  <text x="995" y="178" text-anchor="middle" class="label">全体効果</text>
  <text x="995" y="218" text-anchor="middle" class="body">mean(X_adj | T)</text>
  <text x="995" y="247" text-anchor="middle" class="body">− mean(X_adj | C)</text>
  <text x="995" y="288" text-anchor="middle" class="small">狭いconfidence interval</text>

  <rect x="40" y="430" width="1040" height="130" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="468" class="label">従来の二段階</text>
  <text x="265" y="468" class="body">triggered subsetの効果を推定</text>
  <text x="515" y="468" class="body">→</text>
  <text x="555" y="468" class="body">指標別の希釈式で全体へ戻す</text>
  <text x="70" y="520" class="label">統一手法</text>
  <text x="265" y="520" class="body">all-up指標を目的変数にする</text>
  <text x="515" y="520" class="body">→</text>
  <text x="555" y="520" class="body">trigger情報を共変量として一段で調整</text>
</svg>
