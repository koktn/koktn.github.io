<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">取引履歴から属性データベースを作る二経路の処理</title>
  <desc id="desc">生の購入履歴から、単一商品はResolveを、複数商品の組み合わせは独立したFP-Growthを通り、Profileで合流してTagとユーザー集約を経て属性データベースになる。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#597068"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17362b" flood-opacity=".11"/>
    </filter>
  </defs>
  <rect width="1200" height="780" rx="28" fill="#f7faf8"/>
  <text x="60" y="68" fill="#17362b" font-family="system-ui, sans-serif" font-size="34" font-weight="750">単一商品と複数商品は、別経路でProfileへ合流する</text>

  <g filter="url(#shadow)">
    <rect x="60" y="128" width="190" height="112" rx="20" fill="#ffffff" stroke="#b9c9c2" stroke-width="2"/>
    <text x="155" y="174" text-anchor="middle" fill="#17362b" font-family="system-ui, sans-serif" font-size="24" font-weight="750">生の購入履歴</text>
    <text x="155" y="209" text-anchor="middle" fill="#597068" font-family="system-ui, sans-serif" font-size="18">ユーザー横断の入力</text>
  </g>

  <path d="M250 164H315" fill="none" stroke="#597068" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M250 204H285Q315 204 315 310" fill="none" stroke="#597068" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="340" y="108" width="290" height="150" rx="22" fill="#e8f4ee" stroke="#70a18b" stroke-width="2"/>
    <text x="370" y="151" fill="#1d6046" font-family="system-ui, sans-serif" font-size="25" font-weight="750">単一商品：Resolve</text>
    <text x="370" y="190" fill="#17362b" font-family="system-ui, sans-serif" font-size="20">検索要否 → 根拠取得 → 意味の抽象化</text>
    <text x="370" y="226" fill="#597068" font-family="system-ui, sans-serif" font-size="18">商品ごとに推論入力を整える</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="340" y="298" width="290" height="150" rx="22" fill="#fff1df" stroke="#d9a05d" stroke-width="2"/>
    <text x="370" y="341" fill="#91511c" font-family="system-ui, sans-serif" font-size="25" font-weight="750">複数商品：FP-Growth</text>
    <text x="370" y="380" fill="#17362b" font-family="system-ui, sans-serif" font-size="20">生データから頻出組み合わせを抽出</text>
    <text x="370" y="416" fill="#597068" font-family="system-ui, sans-serif" font-size="18">Resolveとは独立した非LLM処理</text>
  </g>

  <path d="M630 183H700V282" fill="none" stroke="#597068" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M630 373H700V318" fill="none" stroke="#597068" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="730" y="190" width="410" height="220" rx="24" fill="#eaf0f8" stroke="#7596bc" stroke-width="2"/>
    <text x="765" y="236" fill="#2a5680" font-family="system-ui, sans-serif" font-size="27" font-weight="780">Profile：1パターンにつきLLM 1回</text>
    <rect x="765" y="270" width="335" height="42" rx="12" fill="#ffffff"/>
    <text x="786" y="298" fill="#17362b" font-family="system-ui, sans-serif" font-size="19">固定選択式属性（年齢・教育など）</text>
    <rect x="765" y="322" width="335" height="42" rx="12" fill="#ffffff"/>
    <text x="786" y="350" fill="#17362b" font-family="system-ui, sans-serif" font-size="19">自由記述式属性（長い裾の人物像）</text>
    <rect x="765" y="374" width="335" height="42" rx="12" fill="#ffffff"/>
    <text x="786" y="402" fill="#17362b" font-family="system-ui, sans-serif" font-size="19">属性別の事前スコア π(d)</text>
  </g>

  <path d="M935 410V478" fill="none" stroke="#597068" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="720" y="505" width="430" height="110" rx="22" fill="#f0eafa" stroke="#9b80be" stroke-width="2"/>
    <text x="755" y="548" fill="#633f8d" font-family="system-ui, sans-serif" font-size="25" font-weight="750">Tag：自由文を検索語彙へまとめる</text>
    <text x="755" y="584" fill="#17362b" font-family="system-ui, sans-serif" font-size="19">埋め込み → UMAP → HDBSCAN → タグ命名</text>
  </g>

  <path d="M720 560H620Q585 560 585 620V645" fill="none" stroke="#597068" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M935 615V645" fill="none" stroke="#597068" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="420" y="665" width="660" height="74" rx="20" fill="#2f7d5c"/>
    <text x="750" y="697" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="25" font-weight="780">ユーザーへ集約した属性データベース</text>
    <text x="750" y="724" text-anchor="middle" fill="#e6f4ed" font-family="system-ui, sans-serif" font-size="17">固定属性 ＋ タグ ＋ 属性別スコアを検索できる</text>
  </g>
  <text x="60" y="752" fill="#597068" font-family="system-ui, sans-serif" font-size="16">公式実装では頻出組み合わせ抽出がstages 1–4の外で動き、Profile相当の段階が結果を読み込む。</text>
</svg>
