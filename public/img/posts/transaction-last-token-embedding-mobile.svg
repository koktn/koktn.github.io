<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 567" role="img" aria-labelledby="title desc">
  <title id="title">最後の非padding tokenのembedding抽出</title>
  <desc id="desc">説明用の仮想token列。最後の有効tokenのhidden stateを抽出する規則を示す。生成前後の位置の詳細は論文では指定されていない。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#42576b"/></marker></defs>
  <style>text{font-family:system-ui,sans-serif;fill:#183044} .small{font-size:14px} .label{font-size:18px;font-weight:650} .note{font-size:16px} .arrow{stroke:#42576b;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  <rect width="360" height="567" fill="#f7fafc"/>
<text x="20" y="34" class="label">最後の有効なtokenの表現を選ぶ</text><rect x="20" y="58" width="320" height="72" rx="10" fill="#eaf2f8" stroke="#7793a6"/><text x="36" y="87" class="label">説明文＋一語制約</text><text x="36" y="111" class="note">LLMの最終層の表現へ変換</text><path d="M180.0 131L180.0 160" class="arrow"/><text x="20" y="188" class="label">最終層のhidden state</text><rect x="20" y="206" width="96" height="48" rx="6" fill="#e8edf2" stroke="#8395a4" stroke-width="1"/><text x="30" y="236" class="note">token A</text><rect x="126" y="206" width="96" height="48" rx="6" fill="#e8edf2" stroke="#8395a4" stroke-width="1"/><text x="136" y="236" class="note">token B</text><rect x="232" y="206" width="96" height="48" rx="6" fill="#cbeee0" stroke="#226747" stroke-width="3"/><text x="242" y="236" class="note">token C</text><rect x="20" y="274" width="96" height="48" rx="6" fill="#e8edf2" stroke="#8395a4" stroke-width="1"/><text x="30" y="304" class="note">PAD</text><rect x="126" y="274" width="96" height="48" rx="6" fill="#e8edf2" stroke="#8395a4" stroke-width="1"/><text x="136" y="304" class="note">PAD</text><text x="20" y="350" class="note">選択：最後の非padding token</text><text x="20" y="376" class="note">PADの表現は選ばない</text><path d="M180.0 386L180.0 412" class="arrow"/><rect x="20" y="420" width="320" height="72" rx="10" fill="#e3f3ec" stroke="#7793a6"/><text x="36" y="449" class="label">カテゴリのembedding</text><text x="36" y="473" class="note">取引モデルの初期値に使う</text><text x="20" y="524" class="small">配置は説明用の仮想例</text><text x="20" y="545" class="small">生成前後の詳細は論文に記載なし</text>
</svg>
