<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1040" role="img" aria-labelledby="title desc">
  <title id="title">Decision TreeとLattice Searchの探索範囲の違い</title>
  <desc id="desc">Decision Treeは非重複領域へ分割し、Lattice Searchは条件を追加しながら重複スライスも探索する。</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .heading { font-size: 28px; font-weight: 750; }
      .label { font-size: 23px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 15px; fill: #475569; }
      .edge { stroke: #64748b; stroke-width: 2.5; fill: none; }
      .node { stroke: #64748b; stroke-width: 2; rx: 12; }
    </style>
  </defs>
  <rect width="720" height="1040" rx="22" fill="#f8fafc"/>
  <text x="34" y="48" class="heading">速さと網羅性の交換</text>
  <rect x="34" y="78" width="652" height="430" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="58" y="116" class="label">Decision Tree（DT）</text>
  <text x="58" y="146" class="small">非重複の葉へデータを分割</text>
  <path d="M360 189 L236 250 M360 189 L484 250 M236 306 L169 365 M236 306 L303 365 M484 306 L417 365 M484 306 L551 365" class="edge"/>
  <rect x="290" y="164" width="140" height="50" class="node" fill="#dbeafe"/>
  <text x="360" y="196" text-anchor="middle" class="body">全データ</text>
  <rect x="166" y="250" width="140" height="56" class="node" fill="#e0f2fe"/>
  <text x="236" y="285" text-anchor="middle" class="body">A = a</text>
  <rect x="414" y="250" width="140" height="56" class="node" fill="#e0f2fe"/>
  <text x="484" y="285" text-anchor="middle" class="body">A ≠ a</text>
  <rect x="109" y="365" width="120" height="50" class="node" fill="#dcfce7"/>
  <text x="169" y="397" text-anchor="middle" class="body">B = b</text>
  <rect x="243" y="365" width="120" height="50" class="node" fill="#f1f5f9"/>
  <text x="303" y="397" text-anchor="middle" class="body">B ≠ b</text>
  <rect x="357" y="365" width="120" height="50" class="node" fill="#dcfce7"/>
  <text x="417" y="397" text-anchor="middle" class="body">C = c</text>
  <rect x="491" y="365" width="120" height="50" class="node" fill="#f1f5f9"/>
  <text x="551" y="397" text-anchor="middle" class="body">C ≠ c</text>
  <text x="58" y="454" class="body">○ 浅い木で見つかれば速い</text>
  <text x="58" y="484" class="body">△ 重なる失敗条件を見落とし得る</text>

  <rect x="34" y="534" width="652" height="430" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="58" y="572" class="label">Lattice Search（LS）</text>
  <text x="58" y="602" class="small">短い条件へ一つずつ条件を追加</text>
  <path d="M360 645 L190 706 M360 645 L360 706 M360 645 L530 706 M190 762 L275 821 M360 762 L275 821 M360 762 L445 821 M530 762 L445 821" class="edge"/>
  <rect x="290" y="620" width="140" height="50" class="node" fill="#dbeafe"/>
  <text x="360" y="652" text-anchor="middle" class="body">全データ</text>
  <rect x="120" y="706" width="140" height="56" class="node" fill="#e0f2fe"/>
  <text x="190" y="741" text-anchor="middle" class="body">A = a</text>
  <rect x="290" y="706" width="140" height="56" class="node" fill="#e0f2fe"/>
  <text x="360" y="741" text-anchor="middle" class="body">B = b</text>
  <rect x="460" y="706" width="140" height="56" class="node" fill="#e0f2fe"/>
  <text x="530" y="741" text-anchor="middle" class="body">C = c</text>
  <rect x="185" y="821" width="180" height="50" class="node" fill="#dcfce7"/>
  <text x="275" y="853" text-anchor="middle" class="body">A = a ∧ B = b</text>
  <rect x="355" y="821" width="180" height="50" class="node" fill="#dcfce7"/>
  <text x="445" y="853" text-anchor="middle" class="body">B = b ∧ C = c</text>
  <text x="58" y="910" class="body">○ 重複スライスも探索できる</text>
  <text x="58" y="940" class="body">△ 候補数が指数的に増え得る</text>
  <text x="34" y="1009" class="small">原論文 Figure 2・§3.1を基に本記事用に再構成</text>
</svg>
