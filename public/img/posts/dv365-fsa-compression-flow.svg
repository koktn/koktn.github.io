<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">DV365のFunnel Summarization Archによる圧縮</title>
  <desc id="desc">200個の256次元埋め込みを転置してFunnel TransformerとLinear Compression Encoderで58個へ要約し、4-bit量子化する流れ</desc>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#315c54"/>
    </marker>
    <linearGradient id="matrixA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79bca8"/>
      <stop offset="1" stop-color="#d5e9e1"/>
    </linearGradient>
    <linearGradient id="matrixB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5f87ad"/>
      <stop offset="1" stop-color="#dce7f1"/>
    </linearGradient>
    <filter id="shadow2" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1d2c28" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="680" rx="28" fill="#f7f5f0"/>
  <text x="60" y="62" fill="#202522" font-family="Inter, Hiragino Sans, Yu Gothic, sans-serif" font-size="34" font-weight="750">FSAは「embedding次元」ではなく「200個のtoken」を絞る</text>
  <text x="60" y="98" fill="#5e6965" font-family="Inter, Hiragino Sans, Yu Gothic, sans-serif" font-size="19">transposeでparameter共有の向きを変え、block間poolingでtoken数を段階的に減らす</text>

  <g font-family="Inter, Hiragino Sans, Yu Gothic, sans-serif">
    <text x="64" y="156" fill="#196c5b" font-size="16" font-weight="700">INPUT</text>
    <text x="64" y="184" fill="#202522" font-size="22" font-weight="700">pooled embeddings</text>
    <rect x="66" y="218" width="178" height="294" rx="16" fill="url(#matrixA)" stroke="#4d8d7a" stroke-width="2"/>
    <g stroke="#ffffff" stroke-opacity="0.72" stroke-width="2">
      <path d="M 96 218 V 512 M 126 218 V 512 M 156 218 V 512 M 186 218 V 512 M 216 218 V 512"/>
      <path d="M 66 260 H 244 M 66 302 H 244 M 66 344 H 244 M 66 386 H 244 M 66 428 H 244 M 66 470 H 244"/>
    </g>
    <text x="155" y="548" text-anchor="middle" fill="#315c54" font-size="20" font-weight="700">[N, D] = [200, 256]</text>

    <path d="M 270 365 L 346 365" stroke="#315c54" stroke-width="4" fill="none" marker-end="url(#arrow2)"/>
    <text x="308" y="340" text-anchor="middle" fill="#5e6965" font-size="16">transpose</text>

    <text x="372" y="156" fill="#196c5b" font-size="16" font-weight="700">TOKEN-WISE VIEW</text>
    <text x="372" y="184" fill="#202522" font-size="22" font-weight="700">同じ処理を各次元で共有</text>
    <rect x="372" y="250" width="238" height="230" rx="16" fill="url(#matrixA)" stroke="#4d8d7a" stroke-width="2"/>
    <g stroke="#ffffff" stroke-opacity="0.72" stroke-width="2">
      <path d="M 406 250 V 480 M 440 250 V 480 M 474 250 V 480 M 508 250 V 480 M 542 250 V 480 M 576 250 V 480"/>
      <path d="M 372 283 H 610 M 372 316 H 610 M 372 349 H 610 M 372 382 H 610 M 372 415 H 610 M 372 448 H 610"/>
    </g>
    <text x="491" y="520" text-anchor="middle" fill="#315c54" font-size="20" font-weight="700">[D, N] = [256, 200]</text>

    <path d="M 632 365 L 694 365" stroke="#315c54" stroke-width="4" fill="none" marker-end="url(#arrow2)"/>

    <g filter="url(#shadow2)">
      <rect x="720" y="186" width="252" height="142" rx="18" fill="#ffffff"/>
      <text x="742" y="218" fill="#196c5b" font-size="15" font-weight="700">MAIN PATH</text>
      <text x="742" y="254" fill="#202522" font-size="20" font-weight="700">Funnel Transformer</text>
      <text x="742" y="286" fill="#5e6965" font-size="16">attention → token pooling</text>
      <text x="742" y="309" fill="#5e6965" font-size="16">→ attention → pooling …</text>

      <rect x="720" y="360" width="252" height="112" rx="18" fill="#ffffff"/>
      <text x="742" y="392" fill="#315f86" font-size="15" font-weight="700">PARALLEL PATH</text>
      <text x="742" y="428" fill="#202522" font-size="20" font-weight="700">LCE</text>
      <text x="742" y="454" fill="#5e6965" font-size="16">linear compression</text>
    </g>
    <path d="M 690 365 L 706 365 L 706 257 L 716 257" stroke="#315c54" stroke-width="3" fill="none" marker-end="url(#arrow2)"/>
    <path d="M 690 365 L 706 365 L 706 416 L 716 416" stroke="#315f86" stroke-width="3" fill="none" marker-end="url(#arrow2)"/>

    <path d="M 982 329 L 1020 329 L 1020 365 L 1042 365" stroke="#315c54" stroke-width="3" fill="none"/>
    <path d="M 982 416 L 1020 416 L 1020 365" stroke="#315f86" stroke-width="3" fill="none"/>
    <path d="M 1020 365 L 1050 365" stroke="#315c54" stroke-width="4" fill="none" marker-end="url(#arrow2)"/>

    <text x="1028" y="156" fill="#196c5b" font-size="16" font-weight="700">OUTPUT</text>
    <rect x="1050" y="230" width="92" height="270" rx="16" fill="url(#matrixB)" stroke="#315f86" stroke-width="2"/>
    <g stroke="#ffffff" stroke-opacity="0.76" stroke-width="2">
      <path d="M 1080 230 V 500 M 1110 230 V 500"/>
      <path d="M 1050 275 H 1142 M 1050 320 H 1142 M 1050 365 H 1142 M 1050 410 H 1142 M 1050 455 H 1142"/>
    </g>
    <text x="1096" y="536" text-anchor="middle" fill="#315f86" font-size="19" font-weight="700">58 × 256</text>
  </g>

  <rect x="56" y="590" width="1088" height="58" rx="16" fill="#fff4d9" stroke="#ddbd6d" stroke-width="2"/>
  <text x="80" y="626" fill="#72571f" font-family="Inter, Hiragino Sans, Yu Gothic, sans-serif" font-size="18" font-weight="650">4-bit quantization後：58 × 17個の64-bit整数（約7.9 KB / user）｜入力から約50分の1</text>
</svg>
