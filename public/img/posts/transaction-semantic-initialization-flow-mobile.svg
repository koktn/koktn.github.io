<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 734" role="img" aria-labelledby="title desc">
  <title id="title">意味初期化とオンライン推論</title>
  <desc id="desc">カテゴリ説明からLLMで意味ベクトルを事前計算し、取引モデルを初期化して学習する。オンライン推論では学習済み取引モデルを使う。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#42576b"/></marker></defs>
  <style>text{font-family:system-ui,sans-serif;fill:#183044} .small{font-size:14px} .label{font-size:18px;font-weight:650} .note{font-size:16px} .arrow{stroke:#42576b;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  <rect width="360" height="734" fill="#f7fafc"/>
<text x="20" y="34" class="label">LLMを使う処理と、取引の推論</text><text x="20" y="64" class="note">① オフラインでカテゴリの意味を作る</text><rect x="20" y="84" width="320" height="72" rx="10" fill="#eaf2f8" stroke="#7793a6"/><text x="36" y="113" class="label">MCC・merchant・所在地</text><text x="36" y="137" class="note">公式説明や社内情報を収集</text><path d="M180.0 157L180.0 181" class="arrow"/><rect x="20" y="184" width="320" height="72" rx="10" fill="#eaf2f8" stroke="#7793a6"/><text x="36" y="213" class="label">文脈を補ったプロンプト</text><text x="36" y="237" class="note">業種・地域の情報と一語制約</text><path d="M180.0 257L180.0 281" class="arrow"/><rect x="20" y="284" width="320" height="72" rx="10" fill="#eaf2f8" stroke="#7793a6"/><text x="36" y="313" class="label">LLM → hidden state</text><text x="36" y="337" class="note">カテゴリごとのベクトルを抽出</text><path d="M180.0 357L180.0 381" class="arrow"/><rect x="20" y="384" width="320" height="72" rx="10" fill="#eaf2f8" stroke="#7793a6"/><text x="36" y="413" class="label">取引モデルを初期化・学習</text><text x="36" y="437" class="note">取引系列から複数の目的を学ぶ</text><text x="20" y="486" class="note">② 学習後のオンライン推論</text><rect x="20" y="506" width="320" height="72" rx="10" fill="#e3f3ec" stroke="#7793a6"/><text x="36" y="535" class="label">新しい取引系列</text><text x="36" y="559" class="note">学習済み取引モデルへ入力</text><path d="M180.0 579L180.0 604" class="arrow"/><rect x="20" y="609" width="320" height="72" rx="10" fill="#e3f3ec" stroke="#7793a6"/><text x="36" y="638" class="label">次の取引・異常の評価</text><text x="36" y="662" class="note">推論経路にLLMを置かない</text><text x="20" y="712" class="small">矢印：データまたは重みの受け渡し</text>
</svg>
