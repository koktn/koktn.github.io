<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1040" role="img" aria-labelledby="title desc">
  <title id="title">Trigger情報を使う統一的な分散削減</title>
  <desc id="desc">各ユーザーの全体指標、trigger complement指標、trigger率、100% triggerの指示変数を集計し、共変量調整してtreatment群とcontrol群の全体効果を直接推定する。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .heading { font-size: 19px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; fill: #475569; }
      .box { stroke: #64748b; stroke-width: 2; rx: 12; }
      .line { stroke: #475569; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="390" height="1040" rx="18" fill="#f8fafc"/>
  <text x="20" y="34" class="heading">全体効果を直接推定する</text>
  <rect x="60" y="58" width="270" height="90" class="box" fill="#e2e8f0"/>
  <text x="195" y="88" text-anchor="middle" class="label">ユーザー別ログ</text>
  <text x="195" y="114" text-anchor="middle" class="body">セッション・成功・trigger判定・群</text>
  <path d="M195 148 V178" class="line"/>

  <rect x="35" y="185" width="320" height="292" class="box" fill="#ffffff"/>
  <text x="195" y="218" text-anchor="middle" class="label">ユーザー単位に集計</text>
  <rect x="70" y="240" width="250" height="45" rx="9" fill="#dbeafe" stroke="#64748b"/>
  <text x="195" y="268" text-anchor="middle" class="body">全体指標 X</text>
  <rect x="70" y="300" width="250" height="45" rx="9" fill="#dcfce7" stroke="#64748b"/>
  <text x="195" y="328" text-anchor="middle" class="body">complement指標 UnTrX</text>
  <rect x="70" y="360" width="250" height="45" rx="9" fill="#fef3c7" stroke="#64748b"/>
  <text x="195" y="388" text-anchor="middle" class="body">trigger率 TR</text>
  <rect x="70" y="420" width="250" height="45" rx="9" fill="#ede9fe" stroke="#64748b"/>
  <text x="195" y="448" text-anchor="middle" class="body">I(TR = 1)</text>
  <path d="M195 477 V507" class="line"/>

  <rect x="35" y="514" width="320" height="205" class="box" fill="#eef2ff"/>
  <text x="195" y="548" text-anchor="middle" class="label">共変量で調整</text>
  <text x="195" y="583" text-anchor="middle" class="body">X_adj = X − θ₁ UnTrX</text>
  <text x="195" y="612" text-anchor="middle" class="body">− θ₂ TR − θ₃ I(TR = 1)</text>
  <text x="195" y="654" text-anchor="middle" class="small">期待値を保ったまま</text>
  <text x="195" y="676" text-anchor="middle" class="small">偶然の揺れを削る</text>
  <path d="M195 719 V749" class="line"/>

  <rect x="35" y="756" width="320" height="135" class="box" fill="#dcfce7"/>
  <text x="195" y="790" text-anchor="middle" class="label">全体効果</text>
  <text x="195" y="824" text-anchor="middle" class="body">mean(X_adj | T) − mean(X_adj | C)</text>
  <text x="195" y="857" text-anchor="middle" class="small">狭いconfidence interval</text>

  <rect x="20" y="925" width="350" height="78" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="35" y="953" class="small">従来：subsetの効果 → 指標別に希釈</text>
  <text x="35" y="980" class="small">統一：all-up指標 → trigger情報で一段調整</text>
</svg>
