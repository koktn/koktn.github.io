<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">MIT VNAV教材を生成するデータフロー</title>
  <desc id="desc">講義カタログからPDFを取得し、テキスト抽出とページ画像生成を並行して行う。Notes候補を付け、Ollamaで1ページずつ日本語教材を生成し、チェックポイントへ保存してWebアプリ用データへまとめる。中断後は保存済みページを再利用する。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#587067"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#16352a" flood-opacity=".11"/>
    </filter>
  </defs>

  <rect width="1200" height="720" rx="28" fill="#f7faf8"/>
  <text x="60" y="65" fill="#17362b" font-family="system-ui, sans-serif" font-size="34" font-weight="750">PDF群を、再開可能なモバイル教材へ変換する</text>

  <g filter="url(#shadow)">
    <rect x="60" y="120" width="250" height="170" rx="22" fill="#e9f4ef" stroke="#77a591" stroke-width="2"/>
    <text x="185" y="162" text-anchor="middle" fill="#1c5b43" font-family="system-ui, sans-serif" font-size="24" font-weight="750">1. 資料を選ぶ</text>
    <text x="90" y="207" fill="#17362b" font-family="system-ui, sans-serif" font-size="20">講義カタログ</text>
    <text x="90" y="241" fill="#17362b" font-family="system-ui, sans-serif" font-size="20">Slides／Notes PDF</text>
    <text x="90" y="271" fill="#587067" font-family="system-ui, sans-serif" font-size="17">Slides優先、なければNotes</text>
  </g>

  <path d="M310 205H365" fill="none" stroke="#587067" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="390" y="105" width="285" height="95" rx="20" fill="#e9eff8" stroke="#7797bd" stroke-width="2"/>
    <text x="532" y="144" text-anchor="middle" fill="#28557f" font-family="system-ui, sans-serif" font-size="23" font-weight="750">2A. テキスト抽出</text>
    <text x="532" y="177" text-anchor="middle" fill="#587067" font-family="system-ui, sans-serif" font-size="18">pypdfでページ単位に分割</text>

    <rect x="390" y="225" width="285" height="95" rx="20" fill="#fff1df" stroke="#dda45f" stroke-width="2"/>
    <text x="532" y="264" text-anchor="middle" fill="#92511b" font-family="system-ui, sans-serif" font-size="23" font-weight="750">2B. ページ画像化</text>
    <text x="532" y="297" text-anchor="middle" fill="#587067" font-family="system-ui, sans-serif" font-size="18">pdftoppmでJPEGを生成</text>
  </g>

  <path d="M675 152H730" fill="none" stroke="#587067" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M675 272H700Q720 272 720 250V218Q720 196 740 196" fill="none" stroke="#587067" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="755" y="120" width="385" height="170" rx="22" fill="#ffffff" stroke="#bdcbc5" stroke-width="2"/>
    <text x="947" y="162" text-anchor="middle" fill="#17362b" font-family="system-ui, sans-serif" font-size="24" font-weight="750">3. ページ入力を組み立てる</text>
    <text x="790" y="207" fill="#17362b" font-family="system-ui, sans-serif" font-size="20">英語テキスト ＋ Notes候補</text>
    <text x="790" y="242" fill="#17362b" font-family="system-ui, sans-serif" font-size="20">＋ 対応するページ画像</text>
    <text x="790" y="272" fill="#587067" font-family="system-ui, sans-serif" font-size="17">Notes候補は進行率の前後3ページ</text>
  </g>

  <path d="M947 290V350" fill="none" stroke="#587067" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="755" y="375" width="385" height="165" rx="22" fill="#2f7d5c"/>
    <text x="947" y="419" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="25" font-weight="800">4. 1ページずつ生成</text>
    <text x="947" y="459" text-anchor="middle" fill="#e5f5ed" font-family="system-ui, sans-serif" font-size="20">Ollama → 日本語訳・補足・Notes要約</text>
    <text x="947" y="493" text-anchor="middle" fill="#e5f5ed" font-family="system-ui, sans-serif" font-size="20">区切り文字をPythonで構造化</text>
    <text x="947" y="521" text-anchor="middle" fill="#cce9dc" font-family="system-ui, sans-serif" font-size="17">成功したページから順に保存</text>
  </g>

  <path d="M755 458H690" fill="none" stroke="#587067" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="390" y="375" width="270" height="165" rx="22" fill="#fff7e8" stroke="#dda45f" stroke-width="2"/>
    <text x="525" y="418" text-anchor="middle" fill="#92511b" font-family="system-ui, sans-serif" font-size="24" font-weight="750">5. チェックポイント</text>
    <text x="525" y="459" text-anchor="middle" fill="#17362b" font-family="system-ui, sans-serif" font-size="20">translations.json</text>
    <text x="525" y="493" text-anchor="middle" fill="#587067" font-family="system-ui, sans-serif" font-size="18">中断後は保存済みをskip</text>
    <text x="525" y="521" text-anchor="middle" fill="#92511b" font-family="system-ui, sans-serif" font-size="17" font-weight="700">未完了ページだけ再開</text>
  </g>

  <path d="M390 458H325" fill="none" stroke="#587067" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="60" y="375" width="235" height="165" rx="22" fill="#e9eff8" stroke="#7797bd" stroke-width="2"/>
    <text x="177" y="418" text-anchor="middle" fill="#28557f" font-family="system-ui, sans-serif" font-size="24" font-weight="750">6. Web教材</text>
    <text x="177" y="459" text-anchor="middle" fill="#17362b" font-family="system-ui, sans-serif" font-size="19">library.json</text>
    <text x="177" y="491" text-anchor="middle" fill="#17362b" font-family="system-ui, sans-serif" font-size="19">＋ ページ画像</text>
    <text x="177" y="521" text-anchor="middle" fill="#587067" font-family="system-ui, sans-serif" font-size="17">iPhone向けUIで表示</text>
  </g>

  <path d="M525 540V590H947V548" fill="none" stroke="#9a6a2d" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
  <text x="736" y="622" text-anchor="middle" fill="#92511b" font-family="system-ui, sans-serif" font-size="18" font-weight="700">中断時：保存済みページを再利用し、生成処理へ戻る</text>

  <rect x="60" y="650" width="1080" height="2" fill="#d9e2de"/>
  <text x="60" y="688" fill="#587067" font-family="system-ui, sans-serif" font-size="17">矢印は処理順序、破線は中断後の再開経路を示す。</text>
</svg>
