<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 680" role="img" aria-labelledby="title desc">
  <title id="title">Next Merchant Accuracyの比較</title>
  <desc id="desc">Vanillaは7.60%。Llama3-8bによるMCCのみは9.60%、merchantのみ9.91%、両者9.94%、所在地9.47%、全フィールド9.79%。原論文Table 1の3回平均。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#42576b"/></marker></defs>
  <style>text{font-family:system-ui,sans-serif;fill:#183044} .small{font-size:14px} .label{font-size:18px;font-weight:650} .note{font-size:16px} .arrow{stroke:#42576b;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  <rect width="360" height="680" fill="#f7fafc"/>
<text x="20" y="34" class="label">次のmerchantの予測精度</text><text x="20" y="62" class="note">LLM初期化：Llama3-8b（5設定）</text><path d="M24.0 110V572" stroke="#ccd8e2"/><text x="16.0" y="597" class="small">0</text><path d="M87.75 110V572" stroke="#ccd8e2"/><text x="79.75" y="597" class="small">3</text><path d="M151.5 110V572" stroke="#ccd8e2"/><text x="143.5" y="597" class="small">6</text><path d="M215.25 110V572" stroke="#ccd8e2"/><text x="207.25" y="597" class="small">9</text><path d="M279.0 110V572" stroke="#ccd8e2"/><text x="271.0" y="597" class="small">12</text><text x="24" y="103" class="note">Vanilla</text><rect x="24" y="125" width="161.50" height="24" fill="#667d90"/><text x="192.5" y="143" class="small">7.60</text><text x="24" y="186" class="note">MCC</text><rect x="24" y="208" width="204.00" height="24" fill="#256d56"/><text x="235.0" y="226" class="small">9.60</text><text x="24" y="269" class="note">Merchant</text><rect x="24" y="291" width="210.59" height="24" fill="#256d56"/><text x="241.5875" y="309" class="small">9.91</text><text x="24" y="352" class="note">MCC + Merchant</text><rect x="24" y="374" width="211.22" height="24" fill="#256d56"/><text x="242.225" y="392" class="small">9.94</text><text x="24" y="435" class="note">State + City</text><rect x="24" y="457" width="201.24" height="24" fill="#256d56"/><text x="232.23750000000004" y="475" class="small">9.47</text><text x="24" y="518" class="note">All Fields</text><rect x="24" y="540" width="208.04" height="24" fill="#256d56"/><text x="239.0375" y="558" class="small">9.79</text><text x="20" y="632" class="note">Accuracy（%）：0から12の軸</text><text x="20" y="657" class="small">各値は3回の平均。誤差の情報なし。</text>
</svg>
