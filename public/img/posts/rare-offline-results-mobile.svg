<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc">
  <title id="title">RAREと主要baselineのオフライン評価</title>
  <desc id="desc">5,000 queryと150,000広告におけるHR@500、MAP、広告coverageを主要手法で比較した縦長の棒グラフ</desc>
  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .title { font-size: 27px; font-weight: 700; }.panel { font-size: 21px; font-weight: 700; }.label { font-size: 15px; }.value { font-size: 15px; font-weight: 650; }.note { font-size: 15px; fill: #475569; }.grid { stroke: #cbd5e1; stroke-width: 1; }.base { fill: #94a3b8; }.rare { fill: #2563eb; }
  </style>
  <rect width="720" height="1080" fill="#f8fafc" rx="24"/>
  <text x="360" y="45" text-anchor="middle" class="title">RAREのオフライン評価</text>
  <text x="360" y="72" text-anchor="middle" class="note">5,000 query・150,000広告</text>

  <text x="360" y="116" text-anchor="middle" class="panel">HR@500（0〜0.6）</text>
  <line x1="90" y1="310" x2="650" y2="310" class="grid"/>
  <rect x="120" y="183" width="80" height="127" class="base"/><text x="160" y="174" text-anchor="middle" class="value">.381</text>
  <rect x="250" y="166" width="80" height="144" class="base"/><text x="290" y="157" text-anchor="middle" class="value">.431</text>
  <rect x="380" y="153" width="80" height="157" class="base"/><text x="420" y="144" text-anchor="middle" class="value">.471</text>
  <rect x="510" y="139" width="80" height="171" class="rare"/><text x="550" y="130" text-anchor="middle" class="value">.513</text>
  <text x="160" y="336" text-anchor="middle" class="label">BM25</text><text x="290" y="336" text-anchor="middle" class="label">BERT-s</text><text x="420" y="336" text-anchor="middle" class="label">BERT-b</text><text x="550" y="336" text-anchor="middle" class="label">RARE</text>

  <text x="360" y="390" text-anchor="middle" class="panel">MAP（0〜0.2）</text>
  <line x1="90" y1="590" x2="650" y2="590" class="grid"/>
  <rect x="120" y="467" width="80" height="123" class="base"/><text x="160" y="458" text-anchor="middle" class="value">.123</text>
  <rect x="250" y="418" width="80" height="172" class="base"/><text x="290" y="409" text-anchor="middle" class="value">.172</text>
  <rect x="380" y="410" width="80" height="180" class="base"/><text x="420" y="401" text-anchor="middle" class="value">.180</text>
  <rect x="510" y="405" width="80" height="185" class="rare"/><text x="550" y="396" text-anchor="middle" class="value">.185</text>
  <text x="160" y="616" text-anchor="middle" class="label">BM25</text><text x="290" y="616" text-anchor="middle" class="label">BERT-s</text><text x="420" y="616" text-anchor="middle" class="label">SimBERT</text><text x="550" y="616" text-anchor="middle" class="label">RARE</text>

  <text x="360" y="670" text-anchor="middle" class="panel">ACR（0〜100%）</text>
  <line x1="90" y1="870" x2="650" y2="870" class="grid"/>
  <rect x="120" y="718" width="80" height="152" class="base"/><text x="160" y="709" text-anchor="middle" class="value">76.0%</text>
  <rect x="250" y="709" width="80" height="161" class="base"/><text x="290" y="700" text-anchor="middle" class="value">80.5%</text>
  <rect x="380" y="678" width="80" height="192" class="base"/><text x="420" y="669" text-anchor="middle" class="value">96.1%</text>
  <rect x="510" y="680" width="80" height="190" class="rare"/><text x="550" y="671" text-anchor="middle" class="value">95.1%</text>
  <text x="160" y="896" text-anchor="middle" class="label">BM25</text><text x="290" y="896" text-anchor="middle" class="label">BERT-b</text><text x="420" y="896" text-anchor="middle" class="label">Qwen</text><text x="550" y="896" text-anchor="middle" class="label">RARE</text>

  <rect x="55" y="938" width="610" height="94" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="14"/>
  <text x="360" y="969" text-anchor="middle" class="note">HR@500・MAPではRAREが首位。</text>
  <text x="360" y="994" text-anchor="middle" class="note">ACRはQwenなどがわずかに上回る。</text>
  <text x="360" y="1019" text-anchor="middle" class="note">出典：原論文Table 1。誤差の報告なし。</text>
  <rect x="218" y="1043" width="22" height="22" class="rare"/><text x="250" y="1060" class="note">RARE</text><rect x="388" y="1043" width="22" height="22" class="base"/><text x="420" y="1060" class="note">baseline</text>
</svg>
