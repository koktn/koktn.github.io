<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">固定属性評価とタグ属性評価におけるLLMの使い方の違い</title>
  <desc id="desc">固定属性評価では生履歴側だけがLLMを使い属性データベース側は規則集約する。タグ属性評価では生履歴と属性データベースの両方を同じLLM評価役に入力してAUCを比較する。</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#597068"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17362b" flood-opacity=".11"/></filter></defs>
  <rect width="1200" height="760" rx="28" fill="#f7faf8"/>
  <text x="60" y="68" fill="#17362b" font-family="system-ui, sans-serif" font-size="34" font-weight="750">二つの評価は、LLMの置き方が異なる</text>

  <g filter="url(#shadow)"><rect x="60" y="110" width="1080" height="255" rx="24" fill="#ffffff" stroke="#77a591" stroke-width="2"/><text x="95" y="154" fill="#1d6046" font-family="system-ui, sans-serif" font-size="27" font-weight="780">固定属性評価：意図的に非対称</text><text x="95" y="187" fill="#597068" font-family="system-ui, sans-serif" font-size="18">年齢・性別・収入・教育・転居</text>
    <rect x="95" y="220" width="190" height="68" rx="16" fill="#eef3f1"/><text x="190" y="262" text-anchor="middle" fill="#17362b" font-family="system-ui, sans-serif" font-size="21">生の購入履歴</text><path d="M285 254H350" fill="none" stroke="#597068" stroke-width="4" marker-end="url(#arrow)"/><rect x="375" y="220" width="190" height="68" rx="16" fill="#eaf0f8"/><text x="470" y="250" text-anchor="middle" fill="#2a5680" font-family="system-ui, sans-serif" font-size="20" font-weight="750">LLM予測</text><text x="470" y="274" text-anchor="middle" fill="#597068" font-family="system-ui, sans-serif" font-size="16">直接ラベルを出す</text><path d="M565 254H620" fill="none" stroke="#597068" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="95" y="300" width="190" height="46" rx="14" fill="#f0eafa"/><text x="190" y="330" text-anchor="middle" fill="#633f8d" font-family="system-ui, sans-serif" font-size="19">属性DB</text><path d="M285 323H350" fill="none" stroke="#597068" stroke-width="4" marker-end="url(#arrow)"/><rect x="375" y="300" width="190" height="46" rx="14" fill="#fff1df"/><text x="470" y="330" text-anchor="middle" fill="#91511c" font-family="system-ui, sans-serif" font-size="18" font-weight="750">OR／中央値／最頻値</text><path d="M565 323H620" fill="none" stroke="#597068" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="650" y="220" width="190" height="126" rx="18" fill="#e8f4ee"/><text x="745" y="260" text-anchor="middle" fill="#1d6046" font-family="system-ui, sans-serif" font-size="21" font-weight="750">属性予測</text><text x="745" y="292" text-anchor="middle" fill="#17362b" font-family="system-ui, sans-serif" font-size="18">評価時、DB側は</text><text x="745" y="319" text-anchor="middle" fill="#17362b" font-family="system-ui, sans-serif" font-size="18">追加LLMなし</text><path d="M840 283H895" fill="none" stroke="#597068" stroke-width="4" marker-end="url(#arrow)"/><rect x="920" y="240" width="180" height="88" rx="18" fill="#2f7d5c"/><text x="1010" y="276" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="750">自己申告と比較</text><text x="1010" y="304" text-anchor="middle" fill="#e6f4ed" font-family="system-ui, sans-serif" font-size="17">F1／MAE</text>
  </g>

  <g filter="url(#shadow)"><rect x="60" y="405" width="1080" height="285" rx="24" fill="#ffffff" stroke="#7596bc" stroke-width="2"/><text x="95" y="449" fill="#2a5680" font-family="system-ui, sans-serif" font-size="27" font-weight="780">タグ属性評価：同じLLM評価役を両入力へ適用</text><text x="95" y="482" fill="#597068" font-family="system-ui, sans-serif" font-size="18">喫煙・飲酒・糖尿病・出産・妊娠・転居など10属性</text>
    <rect x="95" y="520" width="215" height="60" rx="16" fill="#eef3f1"/><text x="202" y="558" text-anchor="middle" fill="#17362b" font-family="system-ui, sans-serif" font-size="20">生の購入履歴</text><rect x="95" y="605" width="215" height="60" rx="16" fill="#f0eafa"/><text x="202" y="643" text-anchor="middle" fill="#633f8d" font-family="system-ui, sans-serif" font-size="19">タグ＋固定属性</text>
    <path d="M310 550H380" fill="none" stroke="#597068" stroke-width="4" marker-end="url(#arrow)"/><path d="M310 635H380" fill="none" stroke="#597068" stroke-width="4" marker-end="url(#arrow)"/><rect x="405" y="525" width="225" height="135" rx="22" fill="#eaf0f8" stroke="#7596bc" stroke-width="2"/><text x="517" y="568" text-anchor="middle" fill="#2a5680" font-family="system-ui, sans-serif" font-size="21" font-weight="750">同じLLM評価役</text><text x="517" y="602" text-anchor="middle" fill="#17362b" font-family="system-ui, sans-serif" font-size="18">同じプロンプト形式</text><text x="517" y="632" text-anchor="middle" fill="#597068" font-family="system-ui, sans-serif" font-size="17">属性確率を出す</text><path d="M630 592H710" fill="none" stroke="#597068" stroke-width="4" marker-end="url(#arrow)"/><rect x="735" y="535" width="170" height="115" rx="18" fill="#fff1df"/><text x="820" y="575" text-anchor="middle" fill="#91511c" font-family="system-ui, sans-serif" font-size="21" font-weight="750">確率スコア</text><text x="820" y="609" text-anchor="middle" fill="#17362b" font-family="system-ui, sans-serif" font-size="18">入力表現だけが違う</text><path d="M905 592H950" fill="none" stroke="#597068" stroke-width="4" marker-end="url(#arrow)"/><rect x="975" y="548" width="125" height="88" rx="18" fill="#2f7d5c"/><text x="1037" y="582" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="750">AUC</text><text x="1037" y="611" text-anchor="middle" fill="#e6f4ed" font-family="system-ui, sans-serif" font-size="17">順位を比較</text>
  </g>
  <text x="60" y="730" fill="#597068" font-family="system-ui, sans-serif" font-size="18">生履歴は競合手法ではなく、圧縮前の情報を持つ参照入力。</text>
</svg>
