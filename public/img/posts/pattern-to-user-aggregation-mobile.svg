<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1480" viewBox="0 0 720 1480" role="img" aria-labelledby="title desc">
  <title id="title">属性ごとに異なるパターンからユーザーへの集約規則</title>
  <desc id="desc">転居はOR、年齢と収入は階級代表値の加重中央値、性別と教育は最頻値で複数パターンの出力を一人のユーザー属性へ集約する説明用の例。</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#597068"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17362b" flood-opacity=".11"/></filter></defs>
  <style>text{font-size:26px!important}.title{font-size:36px!important}.note{font-size:21px!important}</style>
  <rect width="720" height="1480" rx="28" fill="#f7faf8"/>
  <text class="title" x="44" y="58" fill="#17362b" font-family="system-ui, sans-serif" font-size="29" font-weight="750">属性ごとに集約規則を変える</text>
  <rect x="44" y="88" width="632" height="76" rx="16" fill="#e8f4ee"/>
  <text x="360" y="120" text-anchor="middle" fill="#1d6046" font-family="system-ui, sans-serif" font-size="19" font-weight="700">生成済みのパターン属性を規則で集約</text>
  <text x="360" y="147" text-anchor="middle" fill="#1d6046" font-family="system-ui, sans-serif" font-size="18">追加のLLM呼び出しなし</text>

  <g filter="url(#shadow)"><rect x="70" y="205" width="580" height="330" rx="24" fill="#ffffff" stroke="#77a591" stroke-width="2"/><text x="105" y="250" fill="#1d6046" font-family="system-ui, sans-serif" font-size="27" font-weight="780">転居：OR</text><text x="105" y="286" fill="#597068" font-family="system-ui, sans-serif" font-size="18">一つでも陽性なら陽性</text><rect x="105" y="320" width="140" height="54" rx="14" fill="#eef3f1"/><text x="175" y="355" text-anchor="middle" fill="#17362b" font-family="system-ui, sans-serif" font-size="20">なし</text><rect x="265" y="320" width="140" height="54" rx="14" fill="#fff1df"/><text x="335" y="355" text-anchor="middle" fill="#91511c" font-family="system-ui, sans-serif" font-size="20" font-weight="750">あり</text><rect x="425" y="320" width="140" height="54" rx="14" fill="#eef3f1"/><text x="495" y="355" text-anchor="middle" fill="#17362b" font-family="system-ui, sans-serif" font-size="20">なし</text><path d="M335 392V429" fill="none" stroke="#597068" stroke-width="4" marker-end="url(#arrow)"/><rect x="210" y="450" width="250" height="58" rx="16" fill="#2f7d5c"/><text x="335" y="487" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="750">集約結果：あり</text></g>

  <g filter="url(#shadow)"><rect x="70" y="575" width="580" height="390" rx="24" fill="#ffffff" stroke="#d9a05d" stroke-width="2"/><text x="105" y="620" fill="#91511c" font-family="system-ui, sans-serif" font-size="27" font-weight="780">年齢・収入：加重中央値</text><text x="105" y="656" fill="#597068" font-family="system-ui, sans-serif" font-size="18">階級代表値を順に並べる</text><rect x="105" y="690" width="510" height="50" rx="14" fill="#eef3f1"/><text x="360" y="722" text-anchor="middle" fill="#17362b" font-family="system-ui, sans-serif" font-size="20">25–34歳　重み w₁</text><rect x="105" y="752" width="510" height="50" rx="14" fill="#fff1df" stroke="#d9a05d" stroke-width="2"/><text x="360" y="784" text-anchor="middle" fill="#91511c" font-family="system-ui, sans-serif" font-size="20" font-weight="750">25–34歳　重み w₂</text><rect x="105" y="814" width="510" height="50" rx="14" fill="#eef3f1"/><text x="360" y="846" text-anchor="middle" fill="#17362b" font-family="system-ui, sans-serif" font-size="20">35–44歳　重み w₃</text><path d="M360 870V898" fill="none" stroke="#597068" stroke-width="4" marker-end="url(#arrow)"/><rect x="210" y="910" width="300" height="58" rx="16" fill="#2f7d5c"/><text x="360" y="947" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="21" font-weight="750">中央の階級を採用</text></g>

  <g filter="url(#shadow)"><rect x="70" y="1005" width="580" height="350" rx="24" fill="#ffffff" stroke="#7596bc" stroke-width="2"/><text x="105" y="1050" fill="#2a5680" font-family="system-ui, sans-serif" font-size="27" font-weight="780">性別・教育：最頻値</text><text x="105" y="1086" fill="#597068" font-family="system-ui, sans-serif" font-size="18">最も多い選択肢を採用</text><rect x="105" y="1120" width="140" height="54" rx="14" fill="#eaf0f8"/><text x="175" y="1155" text-anchor="middle" fill="#17362b" font-family="system-ui, sans-serif" font-size="20">学士</text><rect x="265" y="1120" width="140" height="54" rx="14" fill="#eaf0f8"/><text x="335" y="1155" text-anchor="middle" fill="#17362b" font-family="system-ui, sans-serif" font-size="20">学士</text><rect x="425" y="1120" width="140" height="54" rx="14" fill="#eef3f1"/><text x="495" y="1155" text-anchor="middle" fill="#17362b" font-family="system-ui, sans-serif" font-size="19">大学院卒</text><path d="M335 1192V1230" fill="none" stroke="#597068" stroke-width="4" marker-end="url(#arrow)"/><rect x="210" y="1250" width="250" height="58" rx="16" fill="#2f7d5c"/><text x="335" y="1287" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="750">集約結果：学士</text></g>
  <text class="note" x="44" y="1400" fill="#597068" font-family="system-ui, sans-serif" font-size="17">説明用の仮想例。w は各入力の重み。</text>
  <text class="note" x="44" y="1428" fill="#597068" font-family="system-ui, sans-serif" font-size="17">校正済み確率を意味しない。</text>
</svg>
