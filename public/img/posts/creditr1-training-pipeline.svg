<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">CreditR1の3段階学習フロー</title>
  <desc id="desc">財務指標とMD&amp;Aを匿名化した後、根拠を検査したSFTを行い、Brier、Ranking、Evidence、Formatの4報酬でGRPO学習する流れ。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#245b4a"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif; fill: #18231f; }
      .stage { font-size: 22px; font-weight: 750; }
      .heading { font-size: 19px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 13px; fill: #41534c; }
      .arrow { fill: none; stroke: #245b4a; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="610" rx="24" fill="#f7faf8"/>

  <rect x="35" y="55" width="320" height="500" rx="20" fill="#e6f0f8" stroke="#52738a" stroke-width="2"/>
  <text x="60" y="92" class="stage">Stage 0　データ構築</text>
  <rect x="65" y="125" width="260" height="116" rx="14" fill="#fff" stroke="#7895a8"/>
  <text x="90" y="157" class="heading">入力</text>
  <text x="90" y="187" class="body">23個の財務指標と業種内順位</text>
  <text x="90" y="215" class="body">MD&amp;A抜粋 512 token</text>
  <path d="M195 242V282" class="arrow"/>
  <rect x="65" y="285" width="260" height="110" rx="14" fill="#fff" stroke="#7895a8"/>
  <text x="90" y="318" class="heading">情報漏えいを抑える</text>
  <text x="90" y="348" class="body">企業名・銘柄・地理情報を匿名化</text>
  <text x="90" y="376" class="body">2015〜2024年を時間で分割</text>
  <path d="M195 396V436" class="arrow"/>
  <rect x="65" y="438" width="260" height="78" rx="14" fill="#fff" stroke="#7895a8"/>
  <text x="90" y="472" class="heading">固定template</text>
  <text x="90" y="499" class="body">reasoning chain ＋ PDを要求</text>

  <path d="M355 305H415" class="arrow"/>

  <rect x="420" y="55" width="330" height="500" rx="20" fill="#e9f3df" stroke="#67844f" stroke-width="2"/>
  <text x="445" y="92" class="stage">Stage 1　SFT cold start</text>
  <rect x="455" y="125" width="260" height="92" rx="14" fill="#fff" stroke="#829b6f"/>
  <text x="480" y="158" class="heading">GPT-4o教師</text>
  <text x="480" y="188" class="body">正解labelを見ずに説明を生成</text>
  <path d="M585 218V258" class="arrow"/>
  <rect x="455" y="260" width="260" height="142" rx="14" fill="#fff" stroke="#829b6f"/>
  <text x="480" y="293" class="heading">2つのfilter</text>
  <text x="480" y="323" class="body">結論の方向がlabelと一致</text>
  <text x="480" y="351" class="body">数値の80%以上を入力へ追跡</text>
  <text x="480" y="381" class="small">全chainの72%が通過</text>
  <path d="M585 403V443" class="arrow"/>
  <rect x="455" y="445" width="260" height="72" rx="14" fill="#fff" stroke="#829b6f"/>
  <text x="480" y="477" class="heading">Qwen2.5-7BをSFT</text>
  <text x="480" y="502" class="small">初期policyと固定referenceに使用</text>

  <path d="M750 305H810" class="arrow"/>

  <rect x="815" y="55" width="350" height="500" rx="20" fill="#fff0d6" stroke="#a87926" stroke-width="2"/>
  <text x="840" y="92" class="stage">Stage 2　GRPO</text>
  <text x="840" y="121" class="small">1 promptから8 response、3000 step</text>
  <rect x="845" y="150" width="135" height="105" rx="14" fill="#fff" stroke="#bd8f3f"/>
  <text x="864" y="182" class="heading">Brier</text>
  <text x="864" y="209" class="body">確率校正</text>
  <text x="864" y="235" class="small">重み 0.3</text>
  <rect x="1000" y="150" width="135" height="105" rx="14" fill="#fff" stroke="#bd8f3f"/>
  <text x="1019" y="182" class="heading">Ranking</text>
  <text x="1019" y="209" class="body">同業種内の順位</text>
  <text x="1019" y="235" class="small">重み 0.3</text>
  <rect x="845" y="280" width="135" height="105" rx="14" fill="#fff" stroke="#bd8f3f"/>
  <text x="864" y="312" class="heading">Evidence</text>
  <text x="864" y="339" class="body">数値の追跡</text>
  <text x="864" y="365" class="small">重み 0.2</text>
  <rect x="1000" y="280" width="135" height="105" rx="14" fill="#fff" stroke="#bd8f3f"/>
  <text x="1019" y="312" class="heading">Format</text>
  <text x="1019" y="339" class="body">XMLとPD範囲</text>
  <text x="1019" y="365" class="small">重み 0.2</text>
  <path d="M990 395V435" class="arrow"/>
  <rect x="845" y="438" width="290" height="78" rx="14" fill="#fff" stroke="#a87926" stroke-width="2"/>
  <text x="870" y="470" class="heading">校正済みPDと根拠付き説明</text>
  <text x="870" y="498" class="body">greedy decodingで評価</text>
  <text x="600" y="588" text-anchor="middle" class="small">矢印はデータと学習checkpointの流れを示す</text>
</svg>
