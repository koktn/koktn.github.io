<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 535" role="img" aria-labelledby="title desc">
  <title id="title">Next Merchant Accuracyの比較</title>
  <desc id="desc">Vanillaは7.60%。Llama3-8bによるMCCのみは9.60%、merchantのみ9.91%、両者9.94%、所在地9.47%、全フィールド9.79%。原論文Table 1の3回平均。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#42576b"/></marker></defs>
  <style>text{font-family:system-ui,sans-serif;fill:#183044} .small{font-size:14px} .label{font-size:18px;font-weight:650} .note{font-size:16px} .arrow{stroke:#42576b;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  <rect width="720" height="535" fill="#f7fafc"/>
<text x="40" y="34" class="label">次のmerchantの予測精度</text><text x="40" y="62" class="note">LLM初期化：Llama3-8b（5設定）</text><path d="M250.0 115V427" stroke="#ccd8e2"/><text x="242.0" y="452" class="small">0</text><path d="M338.75 115V427" stroke="#ccd8e2"/><text x="330.75" y="452" class="small">3</text><path d="M427.5 115V427" stroke="#ccd8e2"/><text x="419.5" y="452" class="small">6</text><path d="M516.25 115V427" stroke="#ccd8e2"/><text x="508.25" y="452" class="small">9</text><path d="M605.0 115V427" stroke="#ccd8e2"/><text x="597.0" y="452" class="small">12</text><text x="40" y="147" class="note">Vanilla</text><rect x="250" y="130" width="224.83" height="24" fill="#667d90"/><text x="481.83333333333337" y="148" class="small">7.60</text><text x="40" y="200" class="note">MCC</text><rect x="250" y="183" width="284.00" height="24" fill="#256d56"/><text x="541.0" y="201" class="small">9.60</text><text x="40" y="253" class="note">Merchant</text><rect x="250" y="236" width="293.17" height="24" fill="#256d56"/><text x="550.1708333333333" y="254" class="small">9.91</text><text x="40" y="306" class="note">MCC + Merchant</text><rect x="250" y="289" width="294.06" height="24" fill="#256d56"/><text x="551.0583333333334" y="307" class="small">9.94</text><text x="40" y="359" class="note">State + City</text><rect x="250" y="342" width="280.15" height="24" fill="#256d56"/><text x="537.1541666666667" y="360" class="small">9.47</text><text x="40" y="412" class="note">All Fields</text><rect x="250" y="395" width="289.62" height="24" fill="#256d56"/><text x="546.6208333333334" y="413" class="small">9.79</text><text x="40" y="487" class="note">Accuracy（%）：0から12の軸</text><text x="40" y="512" class="small">各値は3回の平均。誤差の情報なし。</text>
</svg>
