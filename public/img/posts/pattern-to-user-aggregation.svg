<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">属性ごとに異なるパターンからユーザーへの集約規則</title>
  <desc id="desc">転居はOR、年齢と収入は階級代表値の加重中央値、性別と教育は最頻値で複数パターンの出力を一人のユーザー属性へ集約する説明用の例。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#597068"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17362b" flood-opacity=".11"/></filter>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#f7faf8"/>
  <text x="60" y="68" fill="#17362b" font-family="system-ui, sans-serif" font-size="34" font-weight="750">属性の性質に合わせて、競合する出力をまとめる</text>
  <rect x="60" y="98" width="1080" height="50" rx="16" fill="#e8f4ee"/>
  <text x="600" y="131" text-anchor="middle" fill="#1d6046" font-family="system-ui, sans-serif" font-size="20" font-weight="700">パターン属性は生成済み：ユーザー集約時に追加のLLM呼び出しはない</text>

  <g filter="url(#shadow)">
    <rect x="60" y="190" width="330" height="410" rx="24" fill="#ffffff" stroke="#77a591" stroke-width="2"/>
    <text x="95" y="238" fill="#1d6046" font-family="system-ui, sans-serif" font-size="27" font-weight="780">転居：OR</text>
    <text x="95" y="276" fill="#597068" font-family="system-ui, sans-serif" font-size="18">一つでも陽性なら陽性</text>
    <rect x="95" y="315" width="110" height="58" rx="14" fill="#eef3f1"/><text x="150" y="352" text-anchor="middle" fill="#17362b" font-family="system-ui, sans-serif" font-size="21">なし</text>
    <rect x="225" y="315" width="110" height="58" rx="14" fill="#fff1df"/><text x="280" y="352" text-anchor="middle" fill="#91511c" font-family="system-ui, sans-serif" font-size="21" font-weight="750">あり</text>
    <rect x="95" y="393" width="110" height="58" rx="14" fill="#eef3f1"/><text x="150" y="430" text-anchor="middle" fill="#17362b" font-family="system-ui, sans-serif" font-size="21">なし</text>
    <path d="M215 475V515" fill="none" stroke="#597068" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="115" y="530" width="220" height="54" rx="16" fill="#2f7d5c"/><text x="225" y="565" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="750">集約結果：あり</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="435" y="190" width="330" height="410" rx="24" fill="#ffffff" stroke="#d9a05d" stroke-width="2"/>
    <text x="470" y="238" fill="#91511c" font-family="system-ui, sans-serif" font-size="27" font-weight="780">年齢・収入：加重中央値</text>
    <text x="470" y="276" fill="#597068" font-family="system-ui, sans-serif" font-size="18">階級代表値を順に並べる</text>
    <rect x="470" y="315" width="260" height="50" rx="14" fill="#eef3f1"/><text x="600" y="347" text-anchor="middle" fill="#17362b" font-family="system-ui, sans-serif" font-size="20">25–34歳　重み w₁</text>
    <rect x="470" y="378" width="260" height="50" rx="14" fill="#fff1df" stroke="#d9a05d" stroke-width="2"/><text x="600" y="410" text-anchor="middle" fill="#91511c" font-family="system-ui, sans-serif" font-size="20" font-weight="750">25–34歳　重み w₂</text>
    <rect x="470" y="441" width="260" height="50" rx="14" fill="#eef3f1"/><text x="600" y="473" text-anchor="middle" fill="#17362b" font-family="system-ui, sans-serif" font-size="20">35–44歳　重み w₃</text>
    <path d="M600 495V520" fill="none" stroke="#597068" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="490" y="535" width="220" height="54" rx="16" fill="#2f7d5c"/><text x="600" y="570" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="21" font-weight="750">中央の階級を採用</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="810" y="190" width="330" height="410" rx="24" fill="#ffffff" stroke="#7596bc" stroke-width="2"/>
    <text x="845" y="238" fill="#2a5680" font-family="system-ui, sans-serif" font-size="27" font-weight="780">性別・教育：最頻値</text>
    <text x="845" y="276" fill="#597068" font-family="system-ui, sans-serif" font-size="18">最も多い選択肢を採用</text>
    <rect x="845" y="315" width="120" height="58" rx="14" fill="#eaf0f8"/><text x="905" y="352" text-anchor="middle" fill="#17362b" font-family="system-ui, sans-serif" font-size="21">学士</text>
    <rect x="985" y="315" width="120" height="58" rx="14" fill="#eaf0f8"/><text x="1045" y="352" text-anchor="middle" fill="#17362b" font-family="system-ui, sans-serif" font-size="21">学士</text>
    <rect x="845" y="393" width="260" height="58" rx="14" fill="#eef3f1"/><text x="975" y="430" text-anchor="middle" fill="#17362b" font-family="system-ui, sans-serif" font-size="21">大学院卒</text>
    <path d="M975 475V515" fill="none" stroke="#597068" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="865" y="530" width="220" height="54" rx="16" fill="#2f7d5c"/><text x="975" y="565" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="750">集約結果：学士</text>
  </g>
  <text x="60" y="664" fill="#597068" font-family="system-ui, sans-serif" font-size="18">図中の値は仕組みを示す仮想例。加重中央値の w は各入力の重みを表し、校正済み確率ではない。</text>
</svg>
