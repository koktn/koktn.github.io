<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1400" viewBox="0 0 720 1400" role="img" aria-labelledby="title desc">
  <title id="title">スマートフォン向けMIT VNAV教材生成フロー</title>
  <desc id="desc">PDFをテキストと画像へ変換し、Notes候補を付けてOllamaで1ページずつ日本語教材を生成する。結果はページ単位でチェックポイントへ保存し、中断後は未完了ページだけを再開してWeb教材へまとめる。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#587067"/>
    </marker>
  </defs>

  <rect width="720" height="1400" rx="28" fill="#f7faf8"/>
  <text x="42" y="58" fill="#17362b" font-family="system-ui, sans-serif" font-size="31" font-weight="750">PDF群をモバイル教材へ変換</text>
  <text x="42" y="94" fill="#587067" font-family="system-ui, sans-serif" font-size="21">1ページ単位で保存し、中断後も続きから再開</text>

  <rect x="55" y="135" width="610" height="150" rx="22" fill="#e9f4ef" stroke="#77a591" stroke-width="2"/>
  <text x="85" y="180" fill="#1c5b43" font-family="system-ui, sans-serif" font-size="28" font-weight="750">1. 資料を選ぶ</text>
  <text x="85" y="226" fill="#17362b" font-family="system-ui, sans-serif" font-size="24">講義カタログ → Slides／Notes PDF</text>
  <text x="85" y="260" fill="#587067" font-family="system-ui, sans-serif" font-size="20">Slides優先、なければNotes</text>

  <path d="M360 285V325" fill="none" stroke="#587067" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="55" y="350" width="290" height="155" rx="22" fill="#e9eff8" stroke="#7797bd" stroke-width="2"/>
  <text x="200" y="395" text-anchor="middle" fill="#28557f" font-family="system-ui, sans-serif" font-size="26" font-weight="750">2A. テキスト</text>
  <text x="200" y="437" text-anchor="middle" fill="#17362b" font-family="system-ui, sans-serif" font-size="22">pypdf</text>
  <text x="200" y="472" text-anchor="middle" fill="#587067" font-family="system-ui, sans-serif" font-size="19">ページ単位に抽出</text>

  <rect x="375" y="350" width="290" height="155" rx="22" fill="#fff1df" stroke="#dda45f" stroke-width="2"/>
  <text x="520" y="395" text-anchor="middle" fill="#92511b" font-family="system-ui, sans-serif" font-size="26" font-weight="750">2B. 画像</text>
  <text x="520" y="437" text-anchor="middle" fill="#17362b" font-family="system-ui, sans-serif" font-size="22">pdftoppm</text>
  <text x="520" y="472" text-anchor="middle" fill="#587067" font-family="system-ui, sans-serif" font-size="19">JPEGを生成</text>

  <path d="M200 505V545H320" fill="none" stroke="#587067" stroke-width="4"/>
  <path d="M520 505V545H400" fill="none" stroke="#587067" stroke-width="4"/>
  <path d="M360 545V580" fill="none" stroke="#587067" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="55" y="605" width="610" height="165" rx="22" fill="#ffffff" stroke="#bdcbc5" stroke-width="2"/>
  <text x="85" y="650" fill="#17362b" font-family="system-ui, sans-serif" font-size="28" font-weight="750">3. ページ入力を組み立てる</text>
  <text x="85" y="696" fill="#17362b" font-family="system-ui, sans-serif" font-size="23">英語テキスト ＋ Notes候補 ＋ 画像</text>
  <text x="85" y="734" fill="#587067" font-family="system-ui, sans-serif" font-size="20">Notes候補は進行率の前後3ページ</text>

  <path d="M360 770V810" fill="none" stroke="#587067" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="55" y="835" width="610" height="175" rx="22" fill="#2f7d5c"/>
  <text x="360" y="882" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="29" font-weight="800">4. Ollamaで1ページずつ生成</text>
  <text x="360" y="928" text-anchor="middle" fill="#e5f5ed" font-family="system-ui, sans-serif" font-size="22">日本語訳・補足・Notes要約</text>
  <text x="360" y="966" text-anchor="middle" fill="#cce9dc" font-family="system-ui, sans-serif" font-size="20">成功したページから順に保存</text>

  <path d="M360 1010V1050" fill="none" stroke="#587067" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="55" y="1075" width="610" height="150" rx="22" fill="#fff7e8" stroke="#dda45f" stroke-width="2"/>
  <text x="85" y="1120" fill="#92511b" font-family="system-ui, sans-serif" font-size="28" font-weight="750">5. チェックポイント</text>
  <text x="85" y="1165" fill="#17362b" font-family="system-ui, sans-serif" font-size="23">translations.jsonへページ単位で保存</text>
  <text x="85" y="1198" fill="#92511b" font-family="system-ui, sans-serif" font-size="20" font-weight="700">中断後は未完了ページだけ再開</text>

  <path d="M360 1225V1260" fill="none" stroke="#587067" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="55" y="1285" width="610" height="80" rx="22" fill="#e9eff8" stroke="#7797bd" stroke-width="2"/>
  <text x="360" y="1335" text-anchor="middle" fill="#28557f" font-family="system-ui, sans-serif" font-size="27" font-weight="750">6. library.json ＋ 画像 → Web教材</text>

  <path d="M665 1150H690V920H672" fill="none" stroke="#9a6a2d" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
  <text x="684" y="1040" text-anchor="end" fill="#92511b" font-family="system-ui, sans-serif" font-size="18" font-weight="700" transform="rotate(-90 684 1040)">再開経路</text>
</svg>
