<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">RLCDAlignBenchでJevを評価する流れ</title>
  <desc id="desc">Jevが見るstateとJevへ尋ねるquestionを別々に変え、1回の呼び出しで複数の確率を得て、AUROCとしきい値付きF1で評価する流れ。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#587067"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#16352a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#f7faf8"/>
  <text x="70" y="72" fill="#17362b" font-family="system-ui, sans-serif" font-size="34" font-weight="750">質問と入力を分けて、失敗検出の原因を切り分ける</text>

  <g filter="url(#shadow)">
    <rect x="70" y="140" width="330" height="190" rx="22" fill="#e9f4ef" stroke="#77a591" stroke-width="2"/>
    <text x="100" y="185" fill="#1c5b43" font-family="system-ui, sans-serif" font-size="25" font-weight="750">Jevが見るもの：state</text>
    <text x="100" y="228" fill="#17362b" font-family="system-ui, sans-serif" font-size="21">• 対象モデルへの入力</text>
    <text x="100" y="266" fill="#17362b" font-family="system-ui, sans-serif" font-size="21">• 対象モデルの出力</text>
    <text x="100" y="304" fill="#587067" font-family="system-ui, sans-serif" font-size="19">＋ 参照情報を1項目ずつ追加</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="390" width="330" height="190" rx="22" fill="#fff1df" stroke="#dda45f" stroke-width="2"/>
    <text x="100" y="435" fill="#92511b" font-family="system-ui, sans-serif" font-size="25" font-weight="750">Jevへ尋ねること：question</text>
    <text x="100" y="478" fill="#17362b" font-family="system-ui, sans-serif" font-size="21">• 汎用／対象特化の文言</text>
    <text x="100" y="516" fill="#17362b" font-family="system-ui, sans-serif" font-size="21">• Noul／Choice／Score</text>
    <text x="100" y="554" fill="#587067" font-family="system-ui, sans-serif" font-size="19">15〜40の読み出し方を比較</text>
  </g>

  <path d="M400 235H505" fill="none" stroke="#587067" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M400 485H455Q490 485 490 450V390Q490 360 520 360" fill="none" stroke="#587067" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="525" y="240" width="230" height="240" rx="115" fill="#2f7d5c"/>
    <text x="640" y="340" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="44" font-weight="800">Jev</text>
    <text x="640" y="382" text-anchor="middle" fill="#e5f5ed" font-family="system-ui, sans-serif" font-size="21">1回の呼び出し</text>
    <text x="640" y="414" text-anchor="middle" fill="#e5f5ed" font-family="system-ui, sans-serif" font-size="21">複数の質問に回答</text>
  </g>

  <path d="M755 360H840" fill="none" stroke="#587067" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="865" y="155" width="265" height="155" rx="22" fill="#e9eff8" stroke="#7797bd" stroke-width="2"/>
    <text x="997" y="203" text-anchor="middle" fill="#28557f" font-family="system-ui, sans-serif" font-size="25" font-weight="750">確率スコア</text>
    <text x="997" y="247" text-anchor="middle" fill="#17362b" font-family="system-ui, sans-serif" font-size="24">P(failure) = 0〜1</text>
    <text x="997" y="278" text-anchor="middle" fill="#587067" font-family="system-ui, sans-serif" font-size="18">argmaxで丸めず保持</text>
  </g>

  <path d="M997 310V365" fill="none" stroke="#587067" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="820" y="390" width="355" height="210" rx="22" fill="#ffffff" stroke="#bdcbc5" stroke-width="2"/>
    <text x="855" y="438" fill="#17362b" font-family="system-ui, sans-serif" font-size="24" font-weight="750">二つの評価を分ける</text>
    <rect x="855" y="468" width="135" height="84" rx="14" fill="#e9f4ef"/>
    <text x="922" y="502" text-anchor="middle" fill="#1c5b43" font-family="system-ui, sans-serif" font-size="21" font-weight="700">AUROC</text>
    <text x="922" y="532" text-anchor="middle" fill="#587067" font-family="system-ui, sans-serif" font-size="17">順位付け</text>
    <rect x="1008" y="468" width="135" height="84" rx="14" fill="#fff1df"/>
    <text x="1075" y="502" text-anchor="middle" fill="#92511b" font-family="system-ui, sans-serif" font-size="21" font-weight="700">F1</text>
    <text x="1075" y="532" text-anchor="middle" fill="#587067" font-family="system-ui, sans-serif" font-size="17">しきい値判定</text>
  </g>

  <text x="70" y="665" fill="#587067" font-family="system-ui, sans-serif" font-size="18">ラベルは評価時だけ使用。質問選択は一方のsplit、報告値はもう一方のsplitで測る。</text>
</svg>
