<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1370" role="img" aria-labelledby="title desc">
  <title id="title">CreditR1の3段階学習フロー</title>
  <desc id="desc">財務指標とMD&amp;Aを匿名化し、根拠を検査したSFTを経て、4種類の報酬でGRPO学習する縦長の処理図。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#245b4a"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif; fill: #18231f; }
      .stage { font-size: 30px; font-weight: 750; }
      .heading { font-size: 25px; font-weight: 700; }
      .body { font-size: 21px; }
      .small { font-size: 18px; fill: #41534c; }
      .arrow { fill: none; stroke: #245b4a; stroke-width: 4; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="720" height="1370" rx="24" fill="#f7faf8"/>
  <rect x="40" y="35" width="640" height="330" rx="22" fill="#e6f0f8" stroke="#52738a" stroke-width="3"/>
  <text x="70" y="82" class="stage">Stage 0　データ構築</text>
  <rect x="70" y="112" width="580" height="102" rx="14" fill="#fff" stroke="#7895a8" stroke-width="2"/>
  <text x="95" y="148" class="heading">入力</text>
  <text x="95" y="182" class="body">23指標＋業種内順位、MD&amp;A 512 token</text>
  <rect x="70" y="232" width="580" height="102" rx="14" fill="#fff" stroke="#7895a8" stroke-width="2"/>
  <text x="95" y="268" class="heading">匿名化と時間分割</text>
  <text x="95" y="302" class="body">企業情報を伏せ、2015〜2024年を分割</text>
  <path d="M360 365V413" class="arrow"/>

  <rect x="40" y="418" width="640" height="340" rx="22" fill="#e9f3df" stroke="#67844f" stroke-width="3"/>
  <text x="70" y="465" class="stage">Stage 1　SFT cold start</text>
  <rect x="70" y="495" width="580" height="95" rx="14" fill="#fff" stroke="#829b6f" stroke-width="2"/>
  <text x="95" y="532" class="heading">GPT-4o教師</text>
  <text x="95" y="566" class="body">正解labelを見ずに説明を生成</text>
  <rect x="70" y="608" width="580" height="120" rx="14" fill="#fff" stroke="#829b6f" stroke-width="2"/>
  <text x="95" y="645" class="heading">結論と根拠をfilter</text>
  <text x="95" y="679" class="body">方向がlabelと一致、数値の80%以上を追跡</text>
  <text x="95" y="710" class="small">通過した72%でQwen2.5-7BをSFT</text>
  <path d="M360 758V806" class="arrow"/>

  <rect x="40" y="811" width="640" height="500" rx="22" fill="#fff0d6" stroke="#a87926" stroke-width="3"/>
  <text x="70" y="858" class="stage">Stage 2　GRPO</text>
  <text x="70" y="892" class="small">1 promptから8 response、3000 step</text>
  <rect x="70" y="925" width="270" height="116" rx="14" fill="#fff" stroke="#bd8f3f" stroke-width="2"/>
  <text x="95" y="964" class="heading">Brier　0.3</text>
  <text x="95" y="1001" class="body">確率校正</text>
  <rect x="380" y="925" width="270" height="116" rx="14" fill="#fff" stroke="#bd8f3f" stroke-width="2"/>
  <text x="405" y="964" class="heading">Ranking　0.3</text>
  <text x="405" y="1001" class="body">同業種内の順位</text>
  <rect x="70" y="1060" width="270" height="116" rx="14" fill="#fff" stroke="#bd8f3f" stroke-width="2"/>
  <text x="95" y="1099" class="heading">Evidence　0.2</text>
  <text x="95" y="1136" class="body">数値の追跡</text>
  <rect x="380" y="1060" width="270" height="116" rx="14" fill="#fff" stroke="#bd8f3f" stroke-width="2"/>
  <text x="405" y="1099" class="heading">Format　0.2</text>
  <text x="405" y="1136" class="body">XMLとPD範囲</text>
  <rect x="70" y="1200" width="580" height="78" rx="14" fill="#fff" stroke="#a87926" stroke-width="2"/>
  <text x="360" y="1249" text-anchor="middle" class="heading">校正済みPD＋根拠付き説明</text>
  <text x="360" y="1343" text-anchor="middle" class="small">矢印はデータとcheckpointの流れを示す</text>
</svg>
