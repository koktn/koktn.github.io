<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">Jevのしきい値別F1とAPI judgeとの費用比較</title>
  <desc id="desc">汎用NoulのF1中央値はしきい値0.5で0.706、10件のラベルで調整すると0.793、交差検証では0.822。19のAPI judgeベンチマークを一巡する費用はJevが0.30ドル、既存judgeが18.96ドル。</desc>
  <rect width="1200" height="840" rx="28" fill="#f7faf8"/>
  <text x="70" y="70" fill="#17362b" font-family="system-ui, sans-serif" font-size="34" font-weight="750">主要結果：しきい値は効くが、費用比には条件がある</text>

  <text x="70" y="135" fill="#17362b" font-family="system-ui, sans-serif" font-size="26" font-weight="750">汎用NoulのF1中央値</text>
  <line x1="350" y1="325" x2="1080" y2="325" stroke="#91a39b" stroke-width="3"/>
  <g fill="#587067" font-family="system-ui, sans-serif" font-size="17">
    <text x="350" y="350" text-anchor="middle">0</text>
    <text x="532" y="350" text-anchor="middle">0.25</text>
    <text x="715" y="350" text-anchor="middle">0.50</text>
    <text x="897" y="350" text-anchor="middle">0.75</text>
    <text x="1080" y="350" text-anchor="middle">1.00</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="21">
    <text x="320" y="190" text-anchor="end" fill="#17362b">しきい値 0.5</text>
    <text x="320" y="255" text-anchor="end" fill="#17362b">10件で調整</text>
    <text x="320" y="320" text-anchor="end" fill="#17362b">交差検証</text>
  </g>
  <rect x="350" y="162" width="515" height="38" rx="9" fill="#8ea9c4"/>
  <text x="882" y="189" fill="#28557f" font-family="system-ui, sans-serif" font-size="21" font-weight="750">0.706</text>
  <rect x="350" y="227" width="579" height="38" rx="9" fill="#4b9878"/>
  <text x="946" y="254" fill="#1c5b43" font-family="system-ui, sans-serif" font-size="21" font-weight="750">0.793</text>
  <rect x="350" y="292" width="600" height="38" rx="9" fill="#2f7d5c"/>
  <text x="967" y="319" fill="#1c5b43" font-family="system-ui, sans-serif" font-size="21" font-weight="750">0.822</text>

  <line x1="70" y1="400" x2="1130" y2="400" stroke="#d8e1dd" stroke-width="2"/>
  <text x="70" y="465" fill="#17362b" font-family="system-ui, sans-serif" font-size="26" font-weight="750">19のAPI judgeベンチマークを一巡する試算</text>
  <line x1="350" y1="655" x2="1080" y2="655" stroke="#91a39b" stroke-width="3"/>
  <g fill="#587067" font-family="system-ui, sans-serif" font-size="17">
    <text x="350" y="680" text-anchor="middle">$0</text>
    <text x="533" y="680" text-anchor="middle">$5</text>
    <text x="715" y="680" text-anchor="middle">$10</text>
    <text x="898" y="680" text-anchor="middle">$15</text>
    <text x="1080" y="680" text-anchor="middle">$20</text>
  </g>
  <text x="320" y="540" text-anchor="end" fill="#17362b" font-family="system-ui, sans-serif" font-size="21">Jev</text>
  <text x="320" y="625" text-anchor="end" fill="#17362b" font-family="system-ui, sans-serif" font-size="21">既存judge</text>
  <rect x="350" y="510" width="11" height="42" rx="5" fill="#2f7d5c"/>
  <text x="378" y="539" fill="#1c5b43" font-family="system-ui, sans-serif" font-size="21" font-weight="750">$0.30</text>
  <rect x="350" y="595" width="692" height="42" rx="9" fill="#c97028"/>
  <text x="1059" y="624" fill="#92511b" font-family="system-ui, sans-serif" font-size="21" font-weight="750">$18.96</text>

  <rect x="70" y="730" width="1060" height="66" rx="18" fill="#fff1df"/>
  <text x="100" y="770" fill="#92511b" font-family="system-ui, sans-serif" font-size="19">約63倍は実験時の定価による合算比。全judgeをGPT-4o-mini料金に揃えた保守的試算では約12倍。</text>
</svg>
