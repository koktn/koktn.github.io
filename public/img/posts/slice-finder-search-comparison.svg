<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc">
  <title id="title">Decision TreeとLattice Searchの探索範囲の違い</title>
  <desc id="desc">Decision Treeはデータを重ならない領域へ分割する一方、Lattice Searchは条件を一つずつ追加して重複するスライスも探索するため、網羅性と計算量に違いがある。</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .heading { font-size: 25px; font-weight: 750; }
      .label { font-size: 18px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 13px; fill: #475569; }
      .edge { stroke: #64748b; stroke-width: 2.5; fill: none; }
      .node { stroke: #64748b; stroke-width: 2; rx: 12; }
    </style>
  </defs>
  <rect width="1120" height="610" rx="22" fill="#f8fafc"/>
  <text x="42" y="48" class="heading">探索方法の違い：速さと網羅性の交換</text>

  <rect x="42" y="78" width="500" height="466" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="66" y="116" class="label">Decision Tree（DT）</text>
  <text x="66" y="142" class="small">分類誤りを分ける木を作り、葉を候補にする</text>
  <path d="M292 183 L185 246 M292 183 L399 246 M185 296 L124 357 M185 296 L246 357 M399 296 L338 357 M399 296 L460 357" class="edge"/>
  <rect x="222" y="158" width="140" height="50" class="node" fill="#dbeafe"/>
  <text x="292" y="189" text-anchor="middle" class="body">全データ</text>
  <rect x="115" y="246" width="140" height="50" class="node" fill="#e0f2fe"/>
  <text x="185" y="277" text-anchor="middle" class="body">A = a</text>
  <rect x="329" y="246" width="140" height="50" class="node" fill="#e0f2fe"/>
  <text x="399" y="277" text-anchor="middle" class="body">A ≠ a</text>
  <rect x="67" y="357" width="114" height="50" class="node" fill="#dcfce7"/>
  <text x="124" y="388" text-anchor="middle" class="body">B = b</text>
  <rect x="189" y="357" width="114" height="50" class="node" fill="#f1f5f9"/>
  <text x="246" y="388" text-anchor="middle" class="body">B ≠ b</text>
  <rect x="281" y="357" width="114" height="50" class="node" fill="#dcfce7"/>
  <text x="338" y="388" text-anchor="middle" class="body">C = c</text>
  <rect x="403" y="357" width="114" height="50" class="node" fill="#f1f5f9"/>
  <text x="460" y="388" text-anchor="middle" class="body">C ≠ c</text>
  <text x="66" y="454" class="body">長所：浅い木で見つかれば速い</text>
  <text x="66" y="482" class="body">弱点：葉は重ならず、別枝の重複条件を見落とす</text>
  <text x="66" y="510" class="small">深くなるほど条件が長くなり、解釈もしにくくなる</text>

  <rect x="578" y="78" width="500" height="466" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="602" y="116" class="label">Lattice Search（LS）</text>
  <text x="602" y="142" class="small">短い条件から、条件を一つずつ追加する</text>
  <path d="M828 183 L675 246 M828 183 L828 246 M828 183 L981 246 M675 296 L751 357 M828 296 L751 357 M828 296 L905 357 M981 296 L905 357" class="edge"/>
  <rect x="758" y="158" width="140" height="50" class="node" fill="#dbeafe"/>
  <text x="828" y="189" text-anchor="middle" class="body">全データ</text>
  <rect x="605" y="246" width="140" height="50" class="node" fill="#e0f2fe"/>
  <text x="675" y="277" text-anchor="middle" class="body">A = a</text>
  <rect x="758" y="246" width="140" height="50" class="node" fill="#e0f2fe"/>
  <text x="828" y="277" text-anchor="middle" class="body">B = b</text>
  <rect x="911" y="246" width="140" height="50" class="node" fill="#e0f2fe"/>
  <text x="981" y="277" text-anchor="middle" class="body">C = c</text>
  <rect x="676" y="357" width="150" height="50" class="node" fill="#dcfce7"/>
  <text x="751" y="388" text-anchor="middle" class="body">A = a ∧ B = b</text>
  <rect x="830" y="357" width="150" height="50" class="node" fill="#dcfce7"/>
  <text x="905" y="388" text-anchor="middle" class="body">B = b ∧ C = c</text>
  <text x="602" y="454" class="body">長所：重複スライスを含む広い候補を探索</text>
  <text x="602" y="482" class="body">弱点：特徴数に対して候補数が指数的に増える</text>
  <text x="602" y="510" class="small">問題と判定した親スライスは、それ以上細分化しない</text>
  <text x="42" y="582" class="small">原論文 Figure 2・§3.1を基に、本記事用の仮想的な特徴 A・B・C で再構成</text>
</svg>
