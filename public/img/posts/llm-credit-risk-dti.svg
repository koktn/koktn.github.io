<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 414" role="img" aria-labelledby="title desc">
  <title id="title">GemmaのDTI説明とSHAP分析の不一致</title>
  <desc id="desc">自己説明では完済予測への影響をnegativeと回答。SHAP分析では高いDTIに正の寄与が見られる。因果効果や全域での単調増加を意味しない。</desc>
  <style>text{font-family:system-ui,sans-serif;fill:#172536}.head{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:14px}</style>
  <rect width="360" height="414" rx="12" fill="#f4f7fb"/>
  <text x="20" y="34" class="head">Gemma-2-9BのDTI</text>
  <rect x="20" y="54" width="320" height="128" rx="8" fill="#fff" stroke="#526b84"/>
  <text x="36" y="84" class="head">自己説明の回答</text><text x="36" y="117" class="body">完済予測への影響はnegative</text><text x="36" y="145" class="body">「債務負担が重いと</text><text x="36" y="169" class="body">返済しにくい」という方向</text>
  <text x="180" y="218" text-anchor="middle" class="head">説明と寄与が不一致</text>
  <rect x="20" y="240" width="320" height="105" rx="8" fill="#fff" stroke="#526b84"/>
  <text x="36" y="271" class="head">SHAP分析での観測</text><text x="36" y="302" class="body">高いDTIの領域で</text><text x="36" y="329" class="body">完済予測に正の寄与が見られる</text>
  <text x="20" y="377" class="small">因果効果・全域の単調増加は示さない</text><text x="20" y="400" class="small">数値の散布図を再現した図ではない</text>
</svg>
