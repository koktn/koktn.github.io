<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 900" role="img" aria-labelledby="title desc">
  <title id="title">追加データを経済価値へ換算する流れ</title>
  <desc id="desc">現在の特徴量だけのモデルと追加データを含むモデルを同じholdout dataで比較し、評価指標の差と判定結果ごとの損益から追加データの価値を求める。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
      .base { fill: #e0f2fe; stroke: #0369a1; stroke-width: 1.5; }
      .inc { fill: #dcfce7; stroke: #15803d; stroke-width: 1.5; }
      .money { fill: #fef3c7; stroke: #b45309; stroke-width: 1.5; }
      .title { font: 700 18px system-ui, sans-serif; fill: #0f172a; }
      .label { font: 700 15px system-ui, sans-serif; fill: #0f172a; }
      .text { font: 14px system-ui, sans-serif; fill: #334155; }
      .note { font: 12px system-ui, sans-serif; fill: #475569; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="360" height="900" rx="16"/>
  <text class="title" x="180" y="35" text-anchor="middle">追加データの価値を測る</text>

  <rect class="base" x="25" y="65" width="310" height="105" rx="12"/>
  <text class="label" x="180" y="93" text-anchor="middle">Baseline</text>
  <text class="text" x="180" y="120" text-anchor="middle">現在の特徴量 X_BL で学習</text>
  <text class="text" x="180" y="145" text-anchor="middle">→ model BL</text>

  <path class="arrow" d="M180 170 V205"/>

  <rect class="inc" x="25" y="215" width="310" height="105" rx="12"/>
  <text class="label" x="180" y="243" text-anchor="middle">Incremental</text>
  <text class="text" x="180" y="270" text-anchor="middle">X_BL + 購入候補 X_Inc で学習</text>
  <text class="text" x="180" y="295" text-anchor="middle">→ model Inc</text>

  <path class="arrow" d="M180 320 V355"/>

  <rect class="box" x="25" y="365" width="310" height="125" rx="12"/>
  <text class="label" x="180" y="393" text-anchor="middle">同じholdout dataで評価</text>
  <text class="text" x="180" y="421" text-anchor="middle">precision / recall / AUC</text>
  <text class="text" x="180" y="449" text-anchor="middle">Δm = m(Inc) − m(BL)</text>
  <text class="note" x="180" y="474" text-anchor="middle">指標は実際のaction policyに合わせる</text>

  <path class="arrow" d="M180 490 V525"/>

  <rect class="money" x="25" y="535" width="310" height="150" rx="12"/>
  <text class="label" x="180" y="563" text-anchor="middle">Cost–confusion matrix</text>
  <text class="text" x="180" y="593" text-anchor="middle">TPの価値と行動費用</text>
  <text class="text" x="180" y="620" text-anchor="middle">FPの費用 / FNの費用</text>
  <text class="text" x="180" y="653" text-anchor="middle">Δmを金額へ変換</text>

  <path class="arrow" d="M180 685 V720"/>

  <rect class="box" x="25" y="730" width="310" height="120" rx="12"/>
  <text class="label" x="180" y="760" text-anchor="middle">追加データの期待価値</text>
  <text class="text" x="180" y="790" text-anchor="middle">1件あたり ΔE[V_i]</text>
  <text class="text" x="180" y="818" text-anchor="middle">× 対象件数</text>

  <text class="note" x="180" y="880" text-anchor="middle">原論文§Estimating the Value of Dataを基に再構成</text>
</svg>
