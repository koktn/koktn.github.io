<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Model 6の調整後に残る分散</title>
  <desc id="desc">ExpA、ExpB、ExpCの全体分析の分散を100パーセントとし、User-triggerとSession-trigger由来の共変量で調整した後の残存分散を比較する。すべての実験でSession-triggerの方が低い。</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .heading { font-size: 23px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; fill: #475569; }
      .grid { stroke: #cbd5e1; stroke-width: 1; }
      .axis { stroke: #475569; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1120" height="620" rx="20" fill="#f8fafc"/>
  <text x="42" y="44" class="heading">Model (6)の残存分散（all-up分析 = 100%）</text>
  <line x1="110" y1="500" x2="1060" y2="500" class="axis"/>
  <line x1="110" y1="100" x2="110" y2="500" class="axis"/>
  <g>
    <line x1="110" y1="500" x2="1060" y2="500" class="grid"/><text x="90" y="505" text-anchor="end" class="small">0%</text>
    <line x1="110" y1="420" x2="1060" y2="420" class="grid"/><text x="90" y="425" text-anchor="end" class="small">20%</text>
    <line x1="110" y1="340" x2="1060" y2="340" class="grid"/><text x="90" y="345" text-anchor="end" class="small">40%</text>
    <line x1="110" y1="260" x2="1060" y2="260" class="grid"/><text x="90" y="265" text-anchor="end" class="small">60%</text>
    <line x1="110" y1="180" x2="1060" y2="180" class="grid"/><text x="90" y="185" text-anchor="end" class="small">80%</text>
    <line x1="110" y1="100" x2="1060" y2="100" class="grid"/><text x="90" y="105" text-anchor="end" class="small">100%</text>
  </g>
  <rect x="210" y="482.4" width="95" height="17.6" fill="#2563eb"/>
  <rect x="315" y="493" width="95" height="7" fill="#f97316"/>
  <text x="257" y="468" text-anchor="middle" class="label">4.40%</text>
  <text x="362" y="478" text-anchor="middle" class="label">1.75%</text>
  <text x="310" y="535" text-anchor="middle" class="label">ExpA</text>

  <rect x="510" y="414.28" width="95" height="85.72" fill="#2563eb"/>
  <rect x="615" y="443.96" width="95" height="56.04" fill="#f97316"/>
  <text x="557" y="400" text-anchor="middle" class="label">21.43%</text>
  <text x="662" y="430" text-anchor="middle" class="label">14.01%</text>
  <text x="610" y="535" text-anchor="middle" class="label">ExpB</text>

  <rect x="810" y="244.12" width="95" height="255.88" fill="#2563eb"/>
  <rect x="915" y="315.88" width="95" height="184.12" fill="#f97316"/>
  <text x="857" y="230" text-anchor="middle" class="label">63.97%</text>
  <text x="962" y="302" text-anchor="middle" class="label">46.03%</text>
  <text x="910" y="535" text-anchor="middle" class="label">ExpC</text>

  <rect x="365" y="568" width="18" height="18" fill="#2563eb"/><text x="390" y="582" class="body">User-trigger共変量</text>
  <rect x="610" y="568" width="18" height="18" fill="#f97316"/><text x="635" y="582" class="body">Session-trigger共変量</text>
</svg>
